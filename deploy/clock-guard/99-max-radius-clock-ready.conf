# Host-only prevention. Loading this drop-in must not restart a running daemon.
[Unit]
Wants=network-online.target systemd-timesyncd.service
After=network-online.target systemd-timesyncd.service

[Service]
ExecStartPre=/usr/bin/python3 /usr/local/libexec/max-radius-clock-ready.py --wait-seconds 180 --poll-seconds 2 --probe-timeout 3
