# Opt-in laboratory profile. Never apply blindly over a customer's private overrides.
# Retain all existing DB command arguments when adapting it to another host.
services:
  mariadb:
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
      - --innodb-log-file-size=64M
      - --innodb-flush-log-at-trx-commit=1
      - --innodb-doublewrite=ON
      - --sync-binlog=1
    stop_grace_period: 120s
    healthcheck:
      start_period: 120s
    labels:
      # Process exit still follows the existing unless-stopped restart policy.
      # An unhealthy DB in crash recovery must not be repeatedly killed by autoheal.
      autoheal: "false"
      autoheal.stop.timeout: "120"
