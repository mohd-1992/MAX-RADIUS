# Use the driver specific SQL escape method.
#
# If you enable this configuration item, the "safe_characters"
# configuration is ignored.  FreeRADIUS then uses the MySQL escape
# functions to escape input strings.  The only downside to making this
# change is that the MySQL escaping method is not the same the one
# used by FreeRADIUS.  So characters which are NOT in the
# "safe_characters" list will now be stored differently in the database.
#
#auto_escape = yes

# Safe characters list for sql queries. Everything else is replaced
# with their mime-encoded equivalents.
# The default list should be ok
# Using 'auto_escape' is preferred
safe_characters = "@abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-_: /"

#######################################################################
#  Connection config
#######################################################################
# The character set is not configurable. The default character set of
# the mysql client library is used. To control the character set,
# create/edit my.cnf (typically in /etc/mysql/my.cnf or /etc/my.cnf)
# and enter
# [client]
# default-character-set = utf8
#

#######################################################################
#  Query config:  Username
#######################################################################
# This is the username that will get substituted, escaped, and added
# as attribute 'SQL-User-Name'. '%{SQL-User-Name}' should be used below
# everywhere a username substitution is needed so you you can be sure
# the username passed from the client is escaped properly.
#
# Uncomment the next line, if you want the sql_user_name to mean:
#
#	Use Stripped-User-Name, if it's there.
#	Else use User-Name, if it's there,
#	Else use hard-coded string "DEFAULT" as the user name.
#sql_user_name = "%{%{Stripped-User-Name}:-%{%{User-Name}:-DEFAULT}}"
#
sql_user_name = "%{User-Name}"

#######################################################################
#  Query config:  Event-Timestamp
#######################################################################
# event_timestamp_epoch is the basis for the time inserted into
# accounting records. Typically this will be the Event-Timestamp of the
# accounting request, which is usually provided by a NAS.
#
# Use server reception time minus transport delay; NAS wall clocks are not trusted.
event_timestamp_epoch = "%l - %{%{Acct-Delay-Time}:-0}"

# event_timestamp is the SQL snippet for converting an epoch timestamp
# to an SQL date.

open_query = "SET time_zone = '+03:00'"
event_timestamp = "FROM_UNIXTIME(${event_timestamp_epoch})"

#######################################################################
#  Query config:  Class attribute
#######################################################################
#
#  3.0.22 and later have a "class" column in the accounting table.
#
#  However, we do NOT want to break existing configurations by adding
#  the Class attribute to the default queries.  If we did that, then
#  systems using newer versions of the server would fail, because
#  there is no "class" column in their accounting tables.
#
#  The solution to that is the following "class" subsection.  If your
#  database has a "class" column for the various tables, then you can
#  uncomment the configuration items here.  The queries below will
#  then automatically insert the Class attribute into radacct,
#  radpostauth, etc.
#
class {
	#
	#  Delete the '#' character from each of the configuration
	#  items in this section.  This change puts the Class
	#  attribute into the various tables.  Leave the double-quoted
	#  string there, as the value for the configuration item.
	#
	#  See also policy.d/accounting, and the "insert_acct_class"
	#  policy.  You will need to list (or uncomment)
	#  "insert_acct_class" in the "post-auth" section in order to
	#  create a Class attribute.
	#
	column_name = ", class"
	packet_xlat = ", '%{string:&request:Class}'"
	reply_xlat = ", '%{string:&reply:Class}'"
}

#######################################################################
# Default profile
#######################################################################
# This is the default profile. It is found in SQL by group membership.
# That means that this profile must be a member of at least one group
# which will contain the corresponding check and reply items.
# This profile will be queried in the authorize section for every user.
# The point is to assign all users a default profile without having to
# manually add each one to a group that will contain the profile.
# The SQL module will also honor the User-Profile attribute. This
# attribute can be set anywhere in the authorize section (ie the users
# file). It is found exactly as the default profile is found.
# If it is set then it will *overwrite* the default profile setting.
# The idea is to select profiles based on checks on the incoming packets,
# not on user group membership. For example:
# -- users file --
# DEFAULT	Service-Type == Outbound-User, User-Profile := "outbound"
# DEFAULT	Service-Type == Framed-User, User-Profile := "framed"
#
# By default the default_user_profile is not set
#
#default_user_profile = "DEFAULT"

#######################################################################
# NAS Query
#######################################################################
# This query retrieves the radius clients
#
# 0. Row ID (currently unused)
# 1. Name (or IP address)
# 2. Shortname
# 3. Type
# 4. Secret
# 5. Server
#######################################################################

client_query = "\
	SELECT id, nasname, shortname, type, secret, server \
	FROM ${client_table}"

#######################################################################
# Authorization Queries
#######################################################################
# These queries compare the check items for the user
# in ${authcheck_table} and setup the reply items in
# ${authreply_table}. You can use any query/tables
# you want, but the return data for each row MUST
# be in the following order:
#
# 0. Row ID (currently unused)
# 1. UserName/GroupName
# 2. Item Attr Name
# 3. Item Attr Value
# 4. Item Attr Operation
#######################################################################
# Use these for case sensitive usernames.

#authorize_check_query = "\
#	SELECT id, username, attribute, value, op \
#	FROM ${authcheck_table} \
#	WHERE username = BINARY '%{SQL-User-Name}' \
#	ORDER BY id"

#authorize_reply_query = "\
#	SELECT id, username, attribute, value, op \
#	FROM ${authreply_table} \
#	WHERE username = BINARY '%{SQL-User-Name}' \
#	ORDER BY id"

authorize_check_query = "\
WITH qa(r,u,st,sp,up,i,o,t)AS(\
SELECT CAST(a.radacctid AS SIGNED),a.username,a.acctstarttime,a.acctstoptime,a.acctupdatetime,\
CASE WHEN seal.acctuniqueid IS NULL THEN a.acctinputoctets ELSE GREATEST(0,CAST(a.acctinputoctets AS DECIMAL(30,0))-seal.input_bytes)END ,\
CASE WHEN seal.acctuniqueid IS NULL THEN a.acctoutputoctets ELSE GREATEST(0,CAST(a.acctoutputoctets AS DECIMAL(30,0))-seal.output_bytes)END ,\
CASE WHEN seal.acctuniqueid IS NULL THEN a.acctsessiontime ELSE GREATEST(0,CAST(a.acctsessiontime AS DECIMAL(30,0))-seal.uptime_seconds)END  \
FROM radacct_owned a LEFT JOIN wisp_account_usage_seals seal ON seal.acctuniqueid=CONVERT(a.acctuniqueid USING ascii)WHERE a.username='%{SQL-User-Name}'\
UNION ALL SELECT -CAST(CONV(SUBSTR(h.summary_key,1,15),16,10)AS SIGNED),v.username,h.first_start,h.first_start,h.last_start,h.input_bytes,h.output_bytes,h.uptime_seconds \
FROM wisp_vouchers v JOIN wisp_account_usage_summary h ON h.voucher_id=v.id WHERE v.username='%{SQL-User-Name}'\
)\
SELECT id,username COLLATE utf8mb4_unicode_ci AS username,attribute COLLATE utf8mb4_unicode_ci AS attribute,value COLLATE utf8mb4_unicode_ci AS value,op COLLATE utf8mb4_unicode_ci AS op \
FROM wisp_mac_radcheck \
WHERE username='%{SQL-User-Name}' \
UNION ALL \
SELECT 999990,_utf8mb4'%{SQL-User-Name}',ac.attribute,ac.val,_utf8mb4':=' \
FROM(\
SELECT 1 FROM wisp_vouchers v JOIN wisp_packages p ON p.id=v.package_id JOIN radacct_owned c ON c.username=v.username LEFT JOIN wisp_session_baselines b ON b.radacctid=c.radacctid AND b.renewed_at=v.last_renewed_at \
WHERE v.username='%{SQL-User-Name}' AND v.last_renewed_at IS NOT NULL AND c.acctstarttime<v.last_renewed_at AND(c.acctstoptime IS NULL OR c.acctstoptime>v.last_renewed_at)AND b.radacctid IS NULL AND(COALESCE(v.snap_volume_quota_mb,p.volume_quota_mb,0)>0 OR COALESCE(v.snap_uptime_limit_mins,p.uptime_limit_mins,0)>0)\
UNION ALL \
SELECT 1 FROM wisp_subscribers s JOIN wisp_packages p ON p.id=s.package_id JOIN radacct_owned c ON c.username=s.username LEFT JOIN wisp_session_baselines b ON b.radacctid=c.radacctid AND b.renewed_at=s.last_renewed_at \
WHERE s.username='%{SQL-User-Name}' AND s.last_renewed_at IS NOT NULL AND c.acctstarttime<s.last_renewed_at AND(c.acctstoptime IS NULL OR c.acctstoptime>s.last_renewed_at)AND b.radacctid IS NULL AND(COALESCE(s.snap_volume_quota_mb,p.volume_quota_mb,0)>0 OR COALESCE(p.uptime_limit_mins,0)>0)\
LIMIT 1 \
)cu CROSS JOIN(\
SELECT _utf8mb4'Auth-Type' AS attribute,_utf8mb4'Reject' AS val \
UNION ALL \
SELECT _utf8mb4'Reply-Message',_utf8mb4'Accounting cycle requires reconciliation' \
)ac \
UNION ALL \
SELECT 999999,_utf8mb4'%{SQL-User-Name}',attr.attribute,attr.val,_utf8mb4':=' \
FROM(\
SELECT 1 FROM(\
SELECT COALESCE(SUM(CASE WHEN b.radacctid IS NOT NULL THEN(CASE WHEN a.i>b.baseline_input_bytes THEN a.i - b.baseline_input_bytes ELSE 0 END+CASE WHEN a.o>b.baseline_output_bytes THEN a.o - b.baseline_output_bytes ELSE 0 END)WHEN v.last_renewed_at IS NULL OR a.st>=v.last_renewed_at THEN(a.i+a.o)ELSE 0 END),0)AS ub,(COALESCE(v.snap_volume_quota_mb,p.volume_quota_mb,0)+COALESCE(v.extra_quota_mb,0))*1048576 AS mb \
FROM wisp_vouchers v JOIN wisp_packages p ON v.package_id=p.id \
LEFT JOIN qa a ON v.username=a.u AND(v.last_renewed_at IS NULL OR a.st>=v.last_renewed_at OR a.sp IS NULL OR a.up>=v.last_renewed_at)\
LEFT JOIN wisp_session_baselines b ON a.r=b.radacctid AND b.renewed_at=v.last_renewed_at \
WHERE v.username='%{SQL-User-Name}' AND COALESCE(v.snap_volume_quota_mb,p.volume_quota_mb,0)>0 \
GROUP BY v.username,v.snap_volume_quota_mb,p.volume_quota_mb,v.extra_quota_mb HAVING ub>=mb \
UNION ALL \
SELECT COALESCE(SUM(CASE WHEN b.radacctid IS NOT NULL THEN(CASE WHEN a.i>b.baseline_input_bytes THEN a.i - b.baseline_input_bytes ELSE 0 END+CASE WHEN a.o>b.baseline_output_bytes THEN a.o - b.baseline_output_bytes ELSE 0 END)WHEN s.last_renewed_at IS NULL OR a.st>=s.last_renewed_at THEN(a.i+a.o)ELSE 0 END),0)AS ub,(COALESCE(s.snap_volume_quota_mb,p.volume_quota_mb,0)+COALESCE(s.extra_quota_mb,0))*1048576 AS mb \
FROM wisp_subscribers s JOIN wisp_packages p ON s.package_id=p.id \
LEFT JOIN qa a ON s.username=a.u AND(s.last_renewed_at IS NULL OR a.st>=s.last_renewed_at OR a.sp IS NULL OR a.up>=s.last_renewed_at)\
LEFT JOIN wisp_session_baselines b ON a.r=b.radacctid AND b.renewed_at=s.last_renewed_at \
WHERE s.username='%{SQL-User-Name}' AND COALESCE(s.snap_volume_quota_mb,p.volume_quota_mb,0)>0 \
GROUP BY s.username,s.snap_volume_quota_mb,p.volume_quota_mb,s.extra_quota_mb HAVING ub>=mb \
)q_ex LIMIT 1 \
)qc \
CROSS JOIN(\
SELECT _utf8mb4'Auth-Type' AS attribute,_utf8mb4'Reject' AS val \
UNION ALL \
SELECT _utf8mb4'Reply-Message' AS attribute,_utf8mb4'لقد استهلكت الرصيد المحدد للباقة' AS val \
)attr \
UNION ALL \
SELECT 999997,_utf8mb4'%{SQL-User-Name}',au.attribute,au.val,_utf8mb4':=' \
FROM(\
SELECT 1 FROM(\
SELECT COALESCE(SUM(CASE WHEN b.radacctid IS NOT NULL THEN(CASE WHEN a.t>b.baseline_seconds THEN a.t - b.baseline_seconds ELSE 0 END)WHEN v.last_renewed_at IS NULL OR a.st>=v.last_renewed_at THEN a.t ELSE 0 END),0)AS us,COALESCE(v.snap_uptime_limit_mins,p.uptime_limit_mins,0)*60 AS ms \
FROM wisp_vouchers v JOIN wisp_packages p ON v.package_id=p.id \
LEFT JOIN qa a ON v.username=a.u AND(v.last_renewed_at IS NULL OR a.st>=v.last_renewed_at OR a.sp IS NULL OR a.up>=v.last_renewed_at)\
LEFT JOIN wisp_session_baselines b ON a.r=b.radacctid AND b.renewed_at=v.last_renewed_at \
WHERE v.username='%{SQL-User-Name}' AND COALESCE(v.snap_uptime_limit_mins,p.uptime_limit_mins,0)>0 \
GROUP BY v.username,v.snap_uptime_limit_mins,p.volume_quota_mb HAVING us>=ms \
UNION ALL \
SELECT COALESCE(SUM(CASE WHEN b.radacctid IS NOT NULL THEN(CASE WHEN a.t>b.baseline_seconds THEN a.t - b.baseline_seconds ELSE 0 END)WHEN s.last_renewed_at IS NULL OR a.st>=s.last_renewed_at THEN a.t ELSE 0 END),0)AS us,p.uptime_limit_mins*60 AS ms \
FROM wisp_subscribers s JOIN wisp_packages p ON s.package_id=p.id \
LEFT JOIN qa a ON s.username=a.u AND(s.last_renewed_at IS NULL OR a.st>=s.last_renewed_at OR a.sp IS NULL OR a.up>=s.last_renewed_at)\
LEFT JOIN wisp_session_baselines b ON a.r=b.radacctid AND b.renewed_at=s.last_renewed_at \
WHERE s.username='%{SQL-User-Name}' AND p.uptime_limit_mins>0 \
GROUP BY s.username,p.uptime_limit_mins HAVING us>=ms \
)u_ex LIMIT 1 \
)uc \
CROSS JOIN(\
SELECT _utf8mb4'Auth-Type' AS attribute,_utf8mb4'Reject' AS val \
UNION ALL \
SELECT _utf8mb4'Reply-Message' AS attribute,_utf8mb4'لقد استهلكت رصيد الوقت المسموح للباقة' AS val \
)au \
UNION ALL \
SELECT 999995,_utf8mb4'%{SQL-User-Name}',_utf8mb4'Auth-Type',_utf8mb4'Reject',_utf8mb4':=' \
FROM(\
SELECT 1 FROM wisp_maintenance_jobs WHERE active_key='factory-reset' AND '%{SQL-User-Name}'<>'healthcheck' \
UNION ALL \
SELECT 1 FROM wisp_vouchers WHERE username='%{SQL-User-Name}' AND(status IN('expired','recharged','disabled','suspended')OR(expires_at IS NOT NULL AND expires_at<CURRENT_TIMESTAMP))\
UNION ALL \
SELECT 1 FROM wisp_subscribers WHERE username='%{SQL-User-Name}' AND(status IN('expired','disabled','suspended')OR(expires_at IS NOT NULL AND expires_at<CURRENT_TIMESTAMP))\
)time_chk \
UNION ALL \
SELECT 999994,_utf8mb4'%{SQL-User-Name}',_utf8mb4'Reply-Message',\
CASE \
WHEN status='recharged' THEN _utf8mb4'هذا الكرت تم شحنه مسبقاً في المحفظة وغير صالح للاتصال' \
WHEN status IN('disabled','suspended') THEN _utf8mb4'هذا الحساب موقوف' \
WHEN status='expired' OR(expires_at IS NOT NULL AND expires_at<CURRENT_TIMESTAMP)THEN _utf8mb4'لقد انتهت صلاحية هذا الكرت / الحساب' \
ELSE _utf8mb4'هذا الحساب / الكرت غير صالح' \
END,_utf8mb4':=' \
FROM(\
SELECT status,expires_at FROM wisp_vouchers WHERE username='%{SQL-User-Name}' AND(status IN('expired','recharged','disabled','suspended')OR(expires_at IS NOT NULL AND expires_at<CURRENT_TIMESTAMP))\
UNION ALL \
SELECT status,expires_at FROM wisp_subscribers WHERE username='%{SQL-User-Name}' AND(status IN('expired','disabled','suspended')OR(expires_at IS NOT NULL AND expires_at<CURRENT_TIMESTAMP))\
LIMIT 1 \
)time_msg"

authorize_reply_query = "\
WITH qa(r,u,st,sp,up,i,o,t)AS(\
SELECT CAST(a.radacctid AS SIGNED),a.username,a.acctstarttime,a.acctstoptime,a.acctupdatetime,\
CASE WHEN seal.acctuniqueid IS NULL THEN a.acctinputoctets ELSE GREATEST(0,CAST(a.acctinputoctets AS DECIMAL(30,0))-seal.input_bytes)END ,\
CASE WHEN seal.acctuniqueid IS NULL THEN a.acctoutputoctets ELSE GREATEST(0,CAST(a.acctoutputoctets AS DECIMAL(30,0))-seal.output_bytes)END ,\
CASE WHEN seal.acctuniqueid IS NULL THEN a.acctsessiontime ELSE GREATEST(0,CAST(a.acctsessiontime AS DECIMAL(30,0))-seal.uptime_seconds)END  \
FROM radacct_owned a LEFT JOIN wisp_account_usage_seals seal ON seal.acctuniqueid=CONVERT(a.acctuniqueid USING ascii)WHERE a.username='%{SQL-User-Name}'\
UNION ALL SELECT -CAST(CONV(SUBSTR(h.summary_key,1,15),16,10)AS SIGNED),v.username,h.first_start,h.first_start,h.last_start,h.input_bytes,h.output_bytes,h.uptime_seconds \
FROM wisp_vouchers v JOIN wisp_account_usage_summary h ON h.voucher_id=v.id WHERE v.username='%{SQL-User-Name}'\
)\
SELECT id,username COLLATE utf8mb4_unicode_ci AS username,attribute COLLATE utf8mb4_unicode_ci AS attribute,value COLLATE utf8mb4_unicode_ci AS value,op COLLATE utf8mb4_unicode_ci AS op FROM ${authreply_table} WHERE username='%{SQL-User-Name}' \
UNION ALL SELECT 999990,_utf8mb4'%{SQL-User-Name}',_utf8mb4'Acct-Interim-Interval',_utf8mb4'180',_utf8mb4':=' \
UNION ALL SELECT 999991,_utf8mb4'%{SQL-User-Name}',_utf8mb4'Mikrotik-Total-Limit',CAST(MOD(GREATEST(0,rem_bytes),4294967296)AS CHAR CHARACTER SET utf8mb4),_utf8mb4':=' FROM(SELECT(COALESCE(v.snap_volume_quota_mb,p.volume_quota_mb,0)+COALESCE(v.extra_quota_mb,0))*1048576 - COALESCE(SUM(CASE WHEN b.radacctid IS NOT NULL THEN(CASE WHEN a.i>b.baseline_input_bytes THEN a.i - b.baseline_input_bytes ELSE 0 END+CASE WHEN a.o>b.baseline_output_bytes THEN a.o - b.baseline_output_bytes ELSE 0 END)WHEN v.last_renewed_at IS NULL THEN(a.i+a.o)WHEN a.st>=v.last_renewed_at THEN(a.i+a.o)ELSE 0 END),0)AS rem_bytes FROM wisp_vouchers v JOIN wisp_packages p ON v.package_id=p.id LEFT JOIN qa a ON v.username=a.u AND(v.last_renewed_at IS NULL OR a.st>=v.last_renewed_at OR a.sp IS NULL OR a.up>=v.last_renewed_at)LEFT JOIN wisp_session_baselines b ON a.r=b.radacctid AND b.renewed_at=v.last_renewed_at WHERE v.username='%{SQL-User-Name}' AND COALESCE(v.snap_volume_quota_mb,p.volume_quota_mb,0)>0 GROUP BY v.username,v.snap_volume_quota_mb,p.volume_quota_mb,v.extra_quota_mb \
UNION ALL SELECT(COALESCE(s.snap_volume_quota_mb,p.volume_quota_mb,0)+COALESCE(s.extra_quota_mb,0))*1048576 - COALESCE(SUM(CASE WHEN b.radacctid IS NOT NULL THEN(CASE WHEN a.i>b.baseline_input_bytes THEN a.i - b.baseline_input_bytes ELSE 0 END+CASE WHEN a.o>b.baseline_output_bytes THEN a.o - b.baseline_output_bytes ELSE 0 END)WHEN s.last_renewed_at IS NULL THEN(a.i+a.o)WHEN a.st>=s.last_renewed_at THEN(a.i+a.o)ELSE 0 END),0)AS rem_bytes FROM wisp_subscribers s JOIN wisp_packages p ON s.package_id=p.id LEFT JOIN qa a ON s.username=a.u AND(s.last_renewed_at IS NULL OR a.st>=s.last_renewed_at OR a.sp IS NULL OR a.up>=s.last_renewed_at)LEFT JOIN wisp_session_baselines b ON a.r=b.radacctid AND b.renewed_at=s.last_renewed_at WHERE s.username='%{SQL-User-Name}' AND COALESCE(s.snap_volume_quota_mb,p.volume_quota_mb,0)>0 GROUP BY s.username,s.snap_volume_quota_mb,p.volume_quota_mb,s.extra_quota_mb)q_tot WHERE rem_bytes>0 \
UNION ALL SELECT 999992,_utf8mb4'%{SQL-User-Name}',_utf8mb4'Mikrotik-Total-Limit-Gigawords',CAST(FLOOR(GREATEST(0,rem_bytes)/4294967296)AS CHAR CHARACTER SET utf8mb4),_utf8mb4':=' FROM(SELECT(COALESCE(v.snap_volume_quota_mb,p.volume_quota_mb,0)+COALESCE(v.extra_quota_mb,0))*1048576 - COALESCE(SUM(CASE WHEN b.radacctid IS NOT NULL THEN(CASE WHEN a.i>b.baseline_input_bytes THEN a.i - b.baseline_input_bytes ELSE 0 END+CASE WHEN a.o>b.baseline_output_bytes THEN a.o - b.baseline_output_bytes ELSE 0 END)WHEN v.last_renewed_at IS NULL THEN(a.i+a.o)WHEN a.st>=v.last_renewed_at THEN(a.i+a.o)ELSE 0 END),0)AS rem_bytes FROM wisp_vouchers v JOIN wisp_packages p ON v.package_id=p.id LEFT JOIN qa a ON v.username=a.u AND(v.last_renewed_at IS NULL OR a.st>=v.last_renewed_at OR a.sp IS NULL OR a.up>=v.last_renewed_at)LEFT JOIN wisp_session_baselines b ON a.r=b.radacctid AND b.renewed_at=v.last_renewed_at WHERE v.username='%{SQL-User-Name}' AND COALESCE(v.snap_volume_quota_mb,p.volume_quota_mb,0)>0 GROUP BY v.username,v.snap_volume_quota_mb,p.volume_quota_mb,v.extra_quota_mb \
UNION ALL SELECT(COALESCE(s.snap_volume_quota_mb,p.volume_quota_mb,0)+COALESCE(s.extra_quota_mb,0))*1048576 - COALESCE(SUM(CASE WHEN b.radacctid IS NOT NULL THEN(CASE WHEN a.i>b.baseline_input_bytes THEN a.i - b.baseline_input_bytes ELSE 0 END+CASE WHEN a.o>b.baseline_output_bytes THEN a.o - b.baseline_output_bytes ELSE 0 END)WHEN s.last_renewed_at IS NULL THEN(a.i+a.o)WHEN a.st>=s.last_renewed_at THEN(a.i+a.o)ELSE 0 END),0)AS rem_bytes FROM wisp_subscribers s JOIN wisp_packages p ON s.package_id=p.id LEFT JOIN qa a ON s.username=a.u AND(s.last_renewed_at IS NULL OR a.st>=s.last_renewed_at OR a.sp IS NULL OR a.up>=s.last_renewed_at)LEFT JOIN wisp_session_baselines b ON a.r=b.radacctid AND b.renewed_at=s.last_renewed_at WHERE s.username='%{SQL-User-Name}' AND COALESCE(s.snap_volume_quota_mb,p.volume_quota_mb,0)>0 GROUP BY s.username,s.snap_volume_quota_mb,p.volume_quota_mb,s.extra_quota_mb)q_gw WHERE FLOOR(GREATEST(0,rem_bytes)/4294967296)>0 \
UNION ALL SELECT 999995,_utf8mb4'%{SQL-User-Name}',_utf8mb4'Session-Timeout',CAST(cal_timeout AS CHAR CHARACTER SET utf8mb4),_utf8mb4':=' FROM(SELECT CASE WHEN up_lim>0 AND(v_exp IS NOT NULL OR val_val>0)THEN LEAST(GREATEST(0,(up_lim*60)- COALESCE(SUM(CASE WHEN b.radacctid IS NOT NULL THEN(CASE WHEN a.t>b.baseline_seconds THEN a.t - b.baseline_seconds ELSE 0 END)WHEN v.last_renewed_at IS NULL THEN a.t WHEN a.st>=v.last_renewed_at THEN a.t ELSE 0 END),0)),CASE WHEN v_exp IS NOT NULL THEN TIMESTAMPDIFF(SECOND,CURRENT_TIMESTAMP,v_exp)WHEN val_unit='minutes' THEN val_val*60 WHEN val_unit='hours' THEN val_val*3600 WHEN val_unit='months' THEN val_val*2592000 ELSE val_val*86400 END)WHEN up_lim>0 THEN GREATEST(0,(up_lim*60)- COALESCE(SUM(CASE WHEN b.radacctid IS NOT NULL THEN(CASE WHEN a.t>b.baseline_seconds THEN a.t - b.baseline_seconds ELSE 0 END)WHEN v.last_renewed_at IS NULL THEN a.t WHEN a.st>=v.last_renewed_at THEN a.t ELSE 0 END),0))WHEN v_exp IS NOT NULL THEN TIMESTAMPDIFF(SECOND,CURRENT_TIMESTAMP,v_exp)WHEN val_val>0 THEN CASE WHEN val_unit='minutes' THEN val_val*60 WHEN val_unit='hours' THEN val_val*3600 WHEN val_unit='months' THEN val_val*2592000 ELSE val_val*86400 END ELSE NULL END AS cal_timeout FROM(SELECT v.id,v.username,v.expires_at AS v_exp,v.last_renewed_at,COALESCE(v.snap_uptime_limit_mins,p.uptime_limit_mins,0)AS up_lim,COALESCE(v.snap_validity_unit,p.validity_unit,'days')AS val_unit,COALESCE(v.snap_validity_value,v.snap_validity_days,p.validity_value,p.validity_days,0)AS val_val FROM wisp_vouchers v JOIN wisp_packages p ON v.package_id=p.id WHERE v.username='%{SQL-User-Name}' AND(v.expires_at IS NULL OR v.expires_at>CURRENT_TIMESTAMP)UNION ALL SELECT s.id,s.username,s.expires_at AS v_exp,s.last_renewed_at,COALESCE(p.uptime_limit_mins,0)AS up_lim,COALESCE(p.validity_unit,'days')AS val_unit,COALESCE(p.validity_value,p.validity_days,0)AS val_val FROM wisp_subscribers s JOIN wisp_packages p ON s.package_id=p.id WHERE s.username='%{SQL-User-Name}' AND(s.expires_at IS NULL OR s.expires_at>CURRENT_TIMESTAMP))v LEFT JOIN qa a ON v.username=a.u AND(v.last_renewed_at IS NULL OR a.st>=v.last_renewed_at OR a.sp IS NULL OR a.up>=v.last_renewed_at)LEFT JOIN wisp_session_baselines b ON a.r=b.radacctid AND b.renewed_at=v.last_renewed_at GROUP BY v.id,v.username,v.v_exp,v.up_lim,v.val_unit,v.val_val)q_tout WHERE cal_timeout>0"

#
#  Use these for case sensitive usernames.
#
#group_membership_query = "\
#	SELECT groupname \
#	FROM ${usergroup_table} \
#	WHERE username = BINARY '%{SQL-User-Name}' \
#	ORDER BY priority"

group_membership_query = "\
	SELECT groupname \
	FROM ${usergroup_table} \
	WHERE username = '%{SQL-User-Name}' \
	ORDER BY priority"

authorize_group_check_query = "\
	SELECT id, groupname, attribute, \
	Value, op \
	FROM ${groupcheck_table} \
	WHERE groupname = '%{${group_attribute}}' \
	ORDER BY id"

authorize_group_reply_query = "\
	SELECT id, groupname, attribute, \
	value, op \
	FROM ${groupreply_table} \
	WHERE groupname = '%{${group_attribute}}' \
	ORDER BY id"

#######################################################################
# Simultaneous Use Checking Queries
#######################################################################
# simul_count_query	- query for the number of current connections
#			- If this is not defined, no simultaneous use checking
#			- will be performed by this module instance
# simul_verify_query	- query to return details of current connections
#				for verification
#			- Leave blank or commented out to disable verification step
#			- Note that the returned field order should not be changed.
#
# Accounting-On/Off can describe a single service restart on a MikroTik.
# nasreload is diagnostic only: it is not evidence that every NAS session ended.
# Count open sessions until genuine Stop or the existing stale-session lifecycle.
#
#######################################################################

simul_count_query = "\
	SELECT COUNT(*) \
	FROM ${acct_table1} \
	WHERE username = '%{SQL-User-Name}' \
	AND acctstoptime IS NULL"

simul_verify_query = "\
	SELECT \
		radacctid, acctsessionid, username, nasipaddress, nasportid, framedipaddress, \
		callingstationid, framedprotocol \
	FROM ${acct_table1} \
	WHERE username = '%{SQL-User-Name}' \
	AND acctstoptime IS NULL"

#######################################################################
# Accounting and Post-Auth Queries
#######################################################################
# These queries insert/update accounting and authentication records.
# The query to use is determined by the value of 'reference'.
# This value is used as a configuration path and should resolve to one
# or more 'query's. If reference points to multiple queries, and a query
# fails, the next query is executed.
#
# Behaviour is identical to the old 1.x/2.x module, except we can now
# fail between N queries, and query selection can be based on any
# combination of attributes, or custom 'Acct-Status-Type' values.
#######################################################################
accounting {
	reference = "%{tolower:type.%{%{Acct-Status-Type}:-%{Request-Processing-Stage}}.query}"

	# Write SQL queries to a logfile. This is potentially useful for bulk inserts
	# when used with the rlm_sql_null driver.
#	logfile = ${logdir}/accounting.sql

	column_list = "\
		acctsessionid,		acctuniqueid,		username, \
		realm,			nasipaddress,		nasportid, \
		nasporttype,		acctstarttime,		acctupdatetime, \
		acctstoptime,		acctsessiontime, 	acctauthentic, \
		connectinfo_start,	connectinfo_stop, 	acctinputoctets, \
		acctoutputoctets,	calledstationid, 	callingstationid, \
		acctterminatecause,	servicetype,		framedprotocol, \
		framedipaddress		${..class.column_name}"

	type {
		accounting-on {
			# Record the service event without manufacturing per-session Stops.
			# A delayed/duplicate event must not move the diagnostic clock backwards.
			# Do not replace this with NAS-wide UPDATE radacct or nasreload filtering:
			# Hotspot and PPP may share NAS-IP-Address while restarting independently.
			query = "\
				INSERT INTO nasreload (nasipaddress, reloadtime) \
				VALUES ('%{NAS-IP-Address}', ${....event_timestamp}) \
				ON DUPLICATE KEY UPDATE \
					reloadtime = GREATEST(reloadtime, VALUES(reloadtime))"
		}

		accounting-off {
			query = "${..accounting-on.query}"
		}

		#
		#  Implement the "sql_session_start" policy.
		#  See raddb/policy.d/accounting for more details.
		#
		#  You also need to fix the other queries as
		#  documented below.  Look for "sql_session_start".
		#
		post-auth {
			query = "\
			INSERT INTO ${....acct_table1} \
				(${...column_list}) \
			VALUES(\
				'%{Acct-Session-Id}', \
				'%{Acct-Unique-Session-Id}', \
				'%{SQL-User-Name}', \
				'%{Realm}', \
				'%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}', \
				NULLIF('%{%{NAS-Port-ID}:-%{NAS-Port}}', ''), \
				'%{NAS-Port-Type}', \
				${....event_timestamp}, \
				NULL, \
				NULL, \
				0, \
				'', \
				'%{Connect-Info}', \
				NULL, \
				0, \
				0, \
				'%{Called-Station-Id}', \
				'%{Calling-Station-Id}', \
				'', \
				'%{Service-Type}', \
				NULL, \
				'', \
				'', \
				'', \
				'', \
				'' \
				${....class.packet_xlat})"

			query = "\
				UPDATE ${....acct_table1} SET \
					AcctStartTime = ${....event_timestamp}, \
					AcctUpdateTime = ${....event_timestamp}, \
					ConnectInfo_start = '%{Connect-Info}', \
					AcctSessionId = '%{Acct-Session-Id}' \
				WHERE UserName = '%{SQL-User-Name}' \
					AND NASIPAddress = '%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}' \
					AND NASPortId = '%{%{NAS-Port-ID}:-%{NAS-Port}}' \
					AND NASPortType = '%{NAS-Port-Type}' \
					AND AcctStopTime IS NULL"
		}

		start {
			#
			#  Insert a new record into the sessions table
			#
			query = "\
				INSERT INTO ${....acct_table1} \
					(${...column_list}) \
				VALUES \
					('%{Acct-Session-Id}', \
					'%{Acct-Unique-Session-Id}', \
					'%{SQL-User-Name}', \
					'%{Realm}', \
					'%{NAS-IP-Address}', \
					'%{%{NAS-Port-ID}:-%{NAS-Port}}', \
					'%{NAS-Port-Type}', \
					${....event_timestamp}, \
					${....event_timestamp}, \
					NULL, \
					'0', \
					'%{Acct-Authentic}', \
					'%{Connect-Info}', \
					'', \
					'0', \
					'0', \
					'%{Called-Station-Id}', \
					'%{Calling-Station-Id}', \
					'', \
					'%{Service-Type}', \
					'%{Framed-Protocol}', \
					'%{Framed-IP-Address}' \
					${....class.packet_xlat})"

			#
			#  When using "sql_session_start", you should comment out
			#  the previous query, and enable this one.
			#
			#  Just change the previous query to "-query",
			#  and this one to "query".  The previous one
			#  will be ignored, and this one will be
			#  enabled.
			#
			-query = "\
				UPDATE ${....acct_table1} \
				SET \
					AcctSessionId = '%{Acct-Session-Id}', \
					AcctUniqueId = '%{Acct-Unique-Session-Id}', \
					AcctAuthentic = '%{Acct-Authentic}', \
					ConnectInfo_start = '%{Connect-Info}', \
					ServiceType = '%{Service-Type}', \
					FramedProtocol = '%{Framed-Protocol}', \
					framedipaddress = '%{Framed-IP-Address}', \
					AcctStartTime = ${....event_timestamp}, \
					AcctUpdateTime = ${....event_timestamp} \
				WHERE UserName = '%{SQL-User-Name}' \
					AND NASIPAddress = '%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}' \
					AND NASPortId = '%{%{NAS-Port-ID}:-%{NAS-Port}}' \
					AND NASPortType = '%{NAS-Port-Type}' \
					AND AcctStopTime IS NULL"

			#
			#  Key constraints prevented us from inserting a new session,
			#  use the alternate query to update an existing session.
			#
			query = "\
				UPDATE ${....acct_table1} SET \
					acctstarttime = COALESCE(acctstarttime, ${....event_timestamp}), \
					acctupdatetime = COALESCE(acctupdatetime, ${....event_timestamp}), \
					connectinfo_start = '%{Connect-Info}' \
				WHERE AcctUniqueId = '%{Acct-Unique-Session-Id}'"

		}

		interim-update {
			query = "\
				UPDATE ${....acct_table1} \
				SET \
					framedipaddress = '%{Framed-IP-Address}', \
					framedipv6address = '%{Framed-IPv6-Address}', \
					framedipv6prefix = '%{Framed-IPv6-Prefix}', \
					framedinterfaceid = '%{Framed-Interface-Id}', \
					delegatedipv6prefix = '%{Delegated-IPv6-Prefix}', \
					acctsessiontime = GREATEST(COALESCE(acctsessiontime, 0), %{%{Acct-Session-Time}:-0}), \
					acctinterval = GREATEST(0, (${....event_timestamp_epoch}) - UNIX_TIMESTAMP(COALESCE(acctupdatetime, acctstarttime))), \
					acctupdatetime = ${....event_timestamp}, \
					acctstoptime = NULL, \
					acctterminatecause = '', \
					acctinputoctets = GREATEST(COALESCE(acctinputoctets, 0), CAST(%{%{Acct-Input-Gigawords}:-0} AS UNSIGNED) * 4294967296 + CAST(%{%{Acct-Input-Octets}:-0} AS UNSIGNED)), \
					acctoutputoctets = GREATEST(COALESCE(acctoutputoctets, 0), CAST(%{%{Acct-Output-Gigawords}:-0} AS UNSIGNED) * 4294967296 + CAST(%{%{Acct-Output-Octets}:-0} AS UNSIGNED)) \
				WHERE acctuniqueid = '%{Acct-Unique-Session-Id}' \
                    AND ${....event_timestamp} >= COALESCE(acctupdatetime, acctstarttime) \
                    AND %{%{Acct-Session-Time}:-2147483647} >= COALESCE(acctsessiontime, 0) \
                    AND (acctstoptime IS NULL OR ( \
                        acctterminatecause IN ('Stale-Session-Timeout', 'Watchdog-Autoheal-Timeout', 'Backup-Restored-Closed') \
                        AND ${....event_timestamp} > acctstoptime \
                        AND %{%{Acct-Session-Time}:-0} > COALESCE(acctsessiontime, 0)))"

			#
			#  The update condition matched no existing sessions. Use
			#  the values provided in the update to create a new session.
			#
			query = "\
				INSERT INTO ${....acct_table1} \
					(${...column_list}) \
				VALUES \
					('%{Acct-Session-Id}', \
					'%{Acct-Unique-Session-Id}', \
					'%{SQL-User-Name}', \
					'%{Realm}', \
					'%{NAS-IP-Address}', \
					'%{%{NAS-Port-ID}:-%{NAS-Port}}', \
					'%{NAS-Port-Type}', \
					FROM_UNIXTIME(${....event_timestamp_epoch} - %{%{Acct-Session-Time}:-0}), \
					${....event_timestamp}, \
					NULL, \
					%{%{Acct-Session-Time}:-NULL}, \
					'%{Acct-Authentic}', \
					'%{Connect-Info}', \
					'', \
					((CAST(COALESCE('%{%{Acct-Input-Gigawords}:-0}', '0') AS UNSIGNED) * 4294967296) + CAST(COALESCE('%{%{Acct-Input-Octets}:-0}', '0') AS UNSIGNED)), \
					((CAST(COALESCE('%{%{Acct-Output-Gigawords}:-0}', '0') AS UNSIGNED) * 4294967296) + CAST(COALESCE('%{%{Acct-Output-Octets}:-0}', '0') AS UNSIGNED)), \
					'%{Called-Station-Id}', \
					'%{Calling-Station-Id}', \
					'', \
					'%{Service-Type}', \
					'%{Framed-Protocol}', \
					'%{Framed-IP-Address}' \
					${....class.packet_xlat}) \
                ON DUPLICATE KEY UPDATE acctuniqueid = VALUES(acctuniqueid)"

			#
			#  When using "sql_session_start", you should comment out
			#  the previous query, and enable this one.
			#
			#  Just change the previous query to "-query",
			#  and this one to "query".  The previous one
			#  will be ignored, and this one will be
			#  enabled.
			#
			-query = "\
				UPDATE ${....acct_table1} \
				SET \
					AcctSessionId = '%{Acct-Session-Id}', \
					AcctUniqueId = '%{Acct-Unique-Session-Id}', \
					AcctAuthentic = '%{Acct-Authentic}', \
					ConnectInfo_start = '%{Connect-Info}', \
					ServiceType = '%{Service-Type}', \
					FramedProtocol = '%{Framed-Protocol}', \
					framedipaddress = '%{Framed-IP-Address}', \
					AcctUpdateTime = ${....event_timestamp}, \
					AcctSessionTime = %{%{Acct-Session-Time}:-NULL}, \
					AcctInputOctets = ((CAST(COALESCE('%{%{Acct-Input-Gigawords}:-0}', '0') AS UNSIGNED) * 4294967296) + CAST(COALESCE('%{%{Acct-Input-Octets}:-0}', '0') AS UNSIGNED)), \
					AcctOutputOctets = ((CAST(COALESCE('%{%{Acct-Output-Gigawords}:-0}', '0') AS UNSIGNED) * 4294967296) + CAST(COALESCE('%{%{Acct-Output-Octets}:-0}', '0') AS UNSIGNED)) \
				WHERE UserName = '%{SQL-User-Name}' \
					AND NASIPAddress = '%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}' \
					AND NASPortId = '%{%{NAS-Port-ID}:-%{NAS-Port}}' \
					AND NASPortType = '%{NAS-Port-Type}' \
					AND AcctStopTime IS NULL"

		}

		stop {
			#
			#  Session has terminated, update the stop time and statistics.
			#
			query = "\
				UPDATE ${....acct_table2} SET \
					acctstoptime = GREATEST(COALESCE(acctstoptime, acctupdatetime, acctstarttime), ${....event_timestamp}), \
					acctsessiontime = GREATEST(COALESCE(acctsessiontime, 0), %{%{Acct-Session-Time}:-0}), \
					acctinputoctets	= GREATEST(COALESCE(acctinputoctets, 0), ((CAST(COALESCE('%{%{Acct-Input-Gigawords}:-0}', '0') AS UNSIGNED) * 4294967296) + CAST(COALESCE('%{%{Acct-Input-Octets}:-0}', '0') AS UNSIGNED))), \
					acctoutputoctets = GREATEST(COALESCE(acctoutputoctets, 0), ((CAST(COALESCE('%{%{Acct-Output-Gigawords}:-0}', '0') AS UNSIGNED) * 4294967296) + CAST(COALESCE('%{%{Acct-Output-Octets}:-0}', '0') AS UNSIGNED))), \
					acctterminatecause = '%{Acct-Terminate-Cause}', \
					connectinfo_stop = '%{Connect-Info}' \
				WHERE AcctUniqueId = '%{Acct-Unique-Session-Id}'"

			#
			#  The update condition matched no existing sessions. Use
			#  the values provided in the update to create a new session.
			#
			query = "\
				INSERT INTO ${....acct_table2} \
					(${...column_list}) \
				VALUES \
					('%{Acct-Session-Id}', \
					'%{Acct-Unique-Session-Id}', \
					'%{SQL-User-Name}', \
					'%{Realm}', \
					'%{NAS-IP-Address}', \
					'%{%{NAS-Port-ID}:-%{NAS-Port}}', \
					'%{NAS-Port-Type}', \
					FROM_UNIXTIME(${....event_timestamp_epoch} - %{%{Acct-Session-Time}:-0}), \
					${....event_timestamp}, \
					${....event_timestamp}, \
					%{%{Acct-Session-Time}:-NULL}, \
					'%{Acct-Authentic}', \
					'', \
					'%{Connect-Info}', \
					((CAST(COALESCE('%{%{Acct-Input-Gigawords}:-0}', '0') AS UNSIGNED) * 4294967296) + CAST(COALESCE('%{%{Acct-Input-Octets}:-0}', '0') AS UNSIGNED)), \
					((CAST(COALESCE('%{%{Acct-Output-Gigawords}:-0}', '0') AS UNSIGNED) * 4294967296) + CAST(COALESCE('%{%{Acct-Output-Octets}:-0}', '0') AS UNSIGNED)), \
					'%{Called-Station-Id}', \
					'%{Calling-Station-Id}', \
					'%{Acct-Terminate-Cause}', \
					'%{Service-Type}', \
					'%{Framed-Protocol}', \
					'%{Framed-IP-Address}' \
					${....class.packet_xlat}) \
                ON DUPLICATE KEY UPDATE acctuniqueid = VALUES(acctuniqueid)"

			#
			#  When using "sql_session_start", you should comment out
			#  the previous query, and enable this one.
			#
			#  Just change the previous query to "-query",
			#  and this one to "query".  The previous one
			#  will be ignored, and this one will be
			#  enabled.
			#
			-query = "\
				UPDATE ${....acct_table1} \
				SET \
					AcctSessionId = '%{Acct-Session-Id}', \
					AcctUniqueId = '%{Acct-Unique-Session-Id}', \
					AcctAuthentic = '%{Acct-Authentic}', \
					ConnectInfo_start = '%{Connect-Info}', \
					ServiceType = '%{Service-Type}', \
					FramedProtocol = '%{Framed-Protocol}', \
					framedipaddress = '%{Framed-IP-Address}', \
					AcctStopTime = ${....event_timestamp}, \
					AcctUpdateTime = ${....event_timestamp}, \
					AcctSessionTime = %{Acct-Session-Time}, \
					AcctInputOctets = ((CAST(COALESCE('%{%{Acct-Input-Gigawords}:-0}', '0') AS UNSIGNED) * 4294967296) + CAST(COALESCE('%{%{Acct-Input-Octets}:-0}', '0') AS UNSIGNED)), \
					AcctOutputOctets = ((CAST(COALESCE('%{%{Acct-Output-Gigawords}:-0}', '0') AS UNSIGNED) * 4294967296) + CAST(COALESCE('%{%{Acct-Output-Octets}:-0}', '0') AS UNSIGNED)), \
					AcctTerminateCause = '%{Acct-Terminate-Cause}', \
					ConnectInfo_stop = '%{Connect-Info}' \
				WHERE UserName = '%{SQL-User-Name}' \
				AND NASIPAddress = '%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}' \
				AND NASPortId = '%{%{NAS-Port-ID}:-%{NAS-Port}}' \
				AND NASPortType = '%{NAS-Port-Type}' \
				AND AcctStopTime IS NULL"

		}

		#
		#  No Acct-Status-Type == ignore the packet
		#
		accounting {
			query = "SELECT true"
		}
	}
}


#######################################################################
# Authentication Logging Queries
#######################################################################
# postauth_query	- Insert some info after authentication
#######################################################################

post-auth {
	# Write SQL queries to a logfile. This is potentially useful for bulk inserts
	# when used with the rlm_sql_null driver.
#	logfile = ${logdir}/post-auth.sql

	query =	"\
		INSERT INTO ${..postauth_table} \
			(username, pass, reply, authdate ${..class.column_name}, nasipaddress, callingstationid) \
		VALUES ( \
			'%{SQL-User-Name}', \
			'%{%{User-Password}:-%{Chap-Password}}', \
			'%{reply:Packet-Type}', \
			'%S.%M' \
			${..class.reply_xlat}, \
			'%{NAS-IP-Address}', \
			'%{Calling-Station-Id}')"
}
