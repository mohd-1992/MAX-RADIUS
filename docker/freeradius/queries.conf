# -*- text -*-
##
## queries.conf -- MySQL default queries and commands for FreeRADIUS 3.x with WISP integration.
##

safe_characters = "@abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-_: /"
group_attribute = "SQL-Group"

#######################################################################
#  Authorization Queries
#######################################################################

authorize_check_query = "\
	SELECT id, username, attribute, value, op \
	FROM ${authcheck_table} \
	WHERE username = '%{SQL-User-Name}' \
	UNION ALL \
	SELECT 999999, _utf8mb4'%{SQL-User-Name}' COLLATE utf8mb4_unicode_ci, _utf8mb4'Auth-Type' COLLATE utf8mb4_unicode_ci, _utf8mb4'Reject' COLLATE utf8mb4_unicode_ci, _utf8mb4':=' COLLATE utf8mb4_unicode_ci \
	FROM wisp_vouchers v \
	LEFT JOIN wisp_packages p ON v.package_id = p.id \
	LEFT JOIN radacct a ON v.username = a.username AND (v.last_renewed_at IS NULL OR a.acctstarttime >= v.last_renewed_at) \
	WHERE v.username = '%{SQL-User-Name}' \
	GROUP BY v.id, v.status, v.expires_at, v.bound_mac, v.snap_volume_quota_mb, p.volume_quota_mb, v.extra_quota_mb, v.snap_uptime_limit_mins, p.uptime_limit_mins \
	HAVING ((CASE WHEN COALESCE(v.snap_volume_quota_mb, 0) > 0 THEN v.snap_volume_quota_mb ELSE COALESCE(p.volume_quota_mb, 0) END + COALESCE(v.extra_quota_mb, 0)) > 0 \
	        AND SUM(COALESCE(a.acctinputoctets+a.acctoutputoctets, 0)) >= (CASE WHEN COALESCE(v.snap_volume_quota_mb, 0) > 0 THEN v.snap_volume_quota_mb ELSE COALESCE(p.volume_quota_mb, 0) END + COALESCE(v.extra_quota_mb, 0))*1048576) \
	    OR ((CASE WHEN COALESCE(v.snap_uptime_limit_mins, 0) > 0 THEN v.snap_uptime_limit_mins ELSE COALESCE(p.uptime_limit_mins, 0) END) > 0 \
	        AND SUM(COALESCE(a.acctsessiontime, 0)) >= (CASE WHEN COALESCE(v.snap_uptime_limit_mins, 0) > 0 THEN v.snap_uptime_limit_mins ELSE COALESCE(p.uptime_limit_mins, 0) END)*60) \
	    OR (v.status IN ('expired','recharged','disabled','suspended') OR (v.expires_at IS NOT NULL AND v.expires_at < CURRENT_TIMESTAMP)) \
	    OR (v.bound_mac != '' AND v.bound_mac IS NOT NULL AND LOWER(REPLACE(v.bound_mac,':','')) != LOWER(REPLACE('%{Calling-Station-Id}',':',''))) \
	UNION ALL \
	SELECT 999998, _utf8mb4'%{SQL-User-Name}' COLLATE utf8mb4_unicode_ci, _utf8mb4'Reply-Message' COLLATE utf8mb4_unicode_ci, \
	       CAST( \
	           CASE \
	               WHEN ((CASE WHEN COALESCE(v.snap_volume_quota_mb, 0) > 0 THEN v.snap_volume_quota_mb ELSE COALESCE(p.volume_quota_mb, 0) END + COALESCE(v.extra_quota_mb, 0)) > 0 \
	                     AND SUM(COALESCE(a.acctinputoctets+a.acctoutputoctets, 0)) >= (CASE WHEN COALESCE(v.snap_volume_quota_mb, 0) > 0 THEN v.snap_volume_quota_mb ELSE COALESCE(p.volume_quota_mb, 0) END + COALESCE(v.extra_quota_mb, 0))*1048576) \
	                    THEN 'انتهى رصيد باقة الإنترنت (التحميل)' \
	               WHEN (v.expires_at IS NOT NULL AND v.expires_at < CURRENT_TIMESTAMP) \
	                    THEN 'انتهت فترة صلاحية هذا الكرت' \
	               WHEN v.status = 'expired' \
	                    THEN 'انتهت صلاحية هذا الكرت' \
	               WHEN v.status IN ('disabled','suspended') \
	                    THEN 'هذا الكرت معطل، يرجى مراجعة إدارة الشبكة' \
	               WHEN (v.bound_mac != '' AND v.bound_mac IS NOT NULL AND LOWER(REPLACE(v.bound_mac,':','')) != LOWER(REPLACE('%{Calling-Station-Id}',':',''))) \
	                    THEN 'الكرت مقيد على جهاز آخر (MAC Mismatch)' \
	               ELSE 'لا يمكن تسجيل الدخول بهذا الكرت' \
	           END \
	       AS CHAR) COLLATE utf8mb4_unicode_ci, \
	       _utf8mb4':=' COLLATE utf8mb4_unicode_ci \
	FROM wisp_vouchers v \
	LEFT JOIN wisp_packages p ON v.package_id = p.id \
	LEFT JOIN radacct a ON v.username = a.username AND (v.last_renewed_at IS NULL OR a.acctstarttime >= v.last_renewed_at) \
	WHERE v.username = '%{SQL-User-Name}' \
	GROUP BY v.id, v.status, v.expires_at, v.bound_mac, v.snap_volume_quota_mb, p.volume_quota_mb, v.extra_quota_mb, v.snap_uptime_limit_mins, p.uptime_limit_mins \
	HAVING ((CASE WHEN COALESCE(v.snap_volume_quota_mb, 0) > 0 THEN v.snap_volume_quota_mb ELSE COALESCE(p.volume_quota_mb, 0) END + COALESCE(v.extra_quota_mb, 0)) > 0 \
	        AND SUM(COALESCE(a.acctinputoctets+a.acctoutputoctets, 0)) >= (CASE WHEN COALESCE(v.snap_volume_quota_mb, 0) > 0 THEN v.snap_volume_quota_mb ELSE COALESCE(p.volume_quota_mb, 0) END + COALESCE(v.extra_quota_mb, 0))*1048576) \
	    OR ((CASE WHEN COALESCE(v.snap_uptime_limit_mins, 0) > 0 THEN v.snap_uptime_limit_mins ELSE COALESCE(p.uptime_limit_mins, 0) END) > 0 \
	        AND SUM(COALESCE(a.acctsessiontime, 0)) >= (CASE WHEN COALESCE(v.snap_uptime_limit_mins, 0) > 0 THEN v.snap_uptime_limit_mins ELSE COALESCE(p.uptime_limit_mins, 0) END)*60) \
	    OR (v.status IN ('expired','recharged','disabled','suspended') OR (v.expires_at IS NOT NULL AND v.expires_at < CURRENT_TIMESTAMP)) \
	    OR (v.bound_mac != '' AND v.bound_mac IS NOT NULL AND LOWER(REPLACE(v.bound_mac,':','')) != LOWER(REPLACE('%{Calling-Station-Id}',':',''))) \
	UNION ALL \
	SELECT 999997, _utf8mb4'%{SQL-User-Name}' COLLATE utf8mb4_unicode_ci, _utf8mb4'Auth-Type' COLLATE utf8mb4_unicode_ci, _utf8mb4'Reject' COLLATE utf8mb4_unicode_ci, _utf8mb4':=' COLLATE utf8mb4_unicode_ci \
	FROM wisp_subscribers s \
	LEFT JOIN wisp_packages p ON s.package_id = p.id \
	LEFT JOIN radacct a ON s.username = a.username AND (s.last_renewed_at IS NULL OR a.acctstarttime >= s.last_renewed_at) \
	WHERE s.username = '%{SQL-User-Name}' \
	GROUP BY s.id, s.status, s.expires_at, s.mac_binding, p.volume_quota_mb, s.extra_quota_mb \
	HAVING ((COALESCE(p.volume_quota_mb, 0) + COALESCE(s.extra_quota_mb, 0)) > 0 \
	        AND SUM(COALESCE(a.acctinputoctets+a.acctoutputoctets, 0)) >= (COALESCE(p.volume_quota_mb, 0) + COALESCE(s.extra_quota_mb, 0))*1048576) \
	    OR (COALESCE(p.volume_quota_mb, 0) > 0 AND (COALESCE(p.volume_quota_mb, 0) + COALESCE(s.extra_quota_mb, 0)) <= 0) \
	    OR (s.status IN ('expired','disabled','suspended') OR (s.expires_at IS NOT NULL AND s.expires_at < CURRENT_TIMESTAMP)) \
	    OR (s.mac_binding != '' AND s.mac_binding IS NOT NULL AND LOWER(REPLACE(s.mac_binding,':','')) != LOWER(REPLACE('%{Calling-Station-Id}',':',''))) \
	UNION ALL \
	SELECT 999996, _utf8mb4'%{SQL-User-Name}' COLLATE utf8mb4_unicode_ci, _utf8mb4'Reply-Message' COLLATE utf8mb4_unicode_ci, \
	       CAST( \
	           CASE \
	               WHEN ((COALESCE(p.volume_quota_mb, 0) + COALESCE(s.extra_quota_mb, 0)) > 0 \
	                     AND SUM(COALESCE(a.acctinputoctets+a.acctoutputoctets, 0)) >= (COALESCE(p.volume_quota_mb, 0) + COALESCE(s.extra_quota_mb, 0))*1048576) \
	                    OR (COALESCE(p.volume_quota_mb, 0) > 0 AND (COALESCE(p.volume_quota_mb, 0) + COALESCE(s.extra_quota_mb, 0)) <= 0) \
	                    THEN 'انتهى رصيد باقة الإنترنت (التحميل)' \
	               WHEN (s.expires_at IS NOT NULL AND s.expires_at < CURRENT_TIMESTAMP) \
	                    THEN 'انتهت فترة اشتراك هذا الحساب' \
	               WHEN s.status = 'expired' \
	                    THEN 'الاشتراك منتهي الصلاحية' \
	               WHEN s.status IN ('disabled','suspended') \
	                    THEN 'الحساب موقوف، يرجى مراجعة إدارة الشبكة' \
	               WHEN (s.mac_binding != '' AND s.mac_binding IS NOT NULL AND LOWER(REPLACE(s.mac_binding,':','')) != LOWER(REPLACE('%{Calling-Station-Id}',':',''))) \
	                    THEN 'الحساب مقيد على جهاز آخر (MAC Mismatch)' \
	               ELSE 'لا يمكن تسجيل الدخول بهذا الحساب' \
	           END \
	       AS CHAR) COLLATE utf8mb4_unicode_ci, \
	       _utf8mb4':=' COLLATE utf8mb4_unicode_ci \
	FROM wisp_subscribers s \
	LEFT JOIN wisp_packages p ON s.package_id = p.id \
	LEFT JOIN radacct a ON s.username = a.username AND (s.last_renewed_at IS NULL OR a.acctstarttime >= s.last_renewed_at) \
	WHERE s.username = '%{SQL-User-Name}' \
	GROUP BY s.id, s.status, s.expires_at, s.mac_binding, p.volume_quota_mb, s.extra_quota_mb \
	HAVING ((COALESCE(p.volume_quota_mb, 0) + COALESCE(s.extra_quota_mb, 0)) > 0 \
	        AND SUM(COALESCE(a.acctinputoctets+a.acctoutputoctets, 0)) >= (COALESCE(p.volume_quota_mb, 0) + COALESCE(s.extra_quota_mb, 0))*1048576) \
	    OR (COALESCE(p.volume_quota_mb, 0) > 0 AND (COALESCE(p.volume_quota_mb, 0) + COALESCE(s.extra_quota_mb, 0)) <= 0) \
	    OR (s.status IN ('expired','disabled','suspended') OR (s.expires_at IS NOT NULL AND s.expires_at < CURRENT_TIMESTAMP)) \
	    OR (s.mac_binding != '' AND s.mac_binding IS NOT NULL AND LOWER(REPLACE(s.mac_binding,':','')) != LOWER(REPLACE('%{Calling-Station-Id}',':','')))"

authorize_reply_query = "\
	SELECT id, username, attribute, value, op \
	FROM ${authreply_table} \
	WHERE username = '%{SQL-User-Name}' \
	UNION ALL \
	SELECT 999990, _utf8mb4'%{SQL-User-Name}' COLLATE utf8mb4_unicode_ci, _utf8mb4'Mikrotik-Total-Limit' COLLATE utf8mb4_unicode_ci, \
	       CONVERT(CAST(MOD(GREATEST(0, (CASE WHEN COALESCE(v.snap_volume_quota_mb, 0) > 0 THEN v.snap_volume_quota_mb ELSE COALESCE(p.volume_quota_mb, 0) END + COALESCE(v.extra_quota_mb, 0)) * 1048576 - SUM(COALESCE(a.acctinputoctets + a.acctoutputoctets, 0))), 4294967296) AS CHAR) USING utf8mb4) COLLATE utf8mb4_unicode_ci, \
	       _utf8mb4':=' COLLATE utf8mb4_unicode_ci \
	FROM wisp_vouchers v \
	LEFT JOIN wisp_packages p ON v.package_id = p.id \
	LEFT JOIN radacct a ON v.username = a.username AND (v.last_renewed_at IS NULL OR a.acctstarttime >= v.last_renewed_at) \
	WHERE v.username = '%{SQL-User-Name}' AND (CASE WHEN COALESCE(v.snap_volume_quota_mb, 0) > 0 THEN v.snap_volume_quota_mb ELSE COALESCE(p.volume_quota_mb, 0) END + COALESCE(v.extra_quota_mb, 0)) > 0 \
	GROUP BY v.id, v.snap_volume_quota_mb, p.volume_quota_mb, v.extra_quota_mb \
	HAVING (CASE WHEN COALESCE(v.snap_volume_quota_mb, 0) > 0 THEN v.snap_volume_quota_mb ELSE COALESCE(p.volume_quota_mb, 0) END + COALESCE(v.extra_quota_mb, 0)) * 1048576 > SUM(COALESCE(a.acctinputoctets + a.acctoutputoctets, 0)) \
	UNION ALL \
	SELECT 999995, _utf8mb4'%{SQL-User-Name}' COLLATE utf8mb4_unicode_ci, _utf8mb4'Mikrotik-Total-Limit-Gigawords' COLLATE utf8mb4_unicode_ci, \
	       CONVERT(CAST(FLOOR(GREATEST(0, (CASE WHEN COALESCE(v.snap_volume_quota_mb, 0) > 0 THEN v.snap_volume_quota_mb ELSE COALESCE(p.volume_quota_mb, 0) END + COALESCE(v.extra_quota_mb, 0)) * 1048576 - SUM(COALESCE(a.acctinputoctets + a.acctoutputoctets, 0))) / 4294967296) AS CHAR) USING utf8mb4) COLLATE utf8mb4_unicode_ci, \
	       _utf8mb4':=' COLLATE utf8mb4_unicode_ci \
	FROM wisp_vouchers v \
	LEFT JOIN wisp_packages p ON v.package_id = p.id \
	LEFT JOIN radacct a ON v.username = a.username AND (v.last_renewed_at IS NULL OR a.acctstarttime >= v.last_renewed_at) \
	WHERE v.username = '%{SQL-User-Name}' AND (CASE WHEN COALESCE(v.snap_volume_quota_mb, 0) > 0 THEN v.snap_volume_quota_mb ELSE COALESCE(p.volume_quota_mb, 0) END + COALESCE(v.extra_quota_mb, 0)) > 0 \
	GROUP BY v.id, v.snap_volume_quota_mb, p.volume_quota_mb, v.extra_quota_mb \
	HAVING (CASE WHEN COALESCE(v.snap_volume_quota_mb, 0) > 0 THEN v.snap_volume_quota_mb ELSE COALESCE(p.volume_quota_mb, 0) END + COALESCE(v.extra_quota_mb, 0)) * 1048576 >= 4294967296 \
	UNION ALL \
	SELECT 999991, _utf8mb4'%{SQL-User-Name}' COLLATE utf8mb4_unicode_ci, _utf8mb4'Session-Timeout' COLLATE utf8mb4_unicode_ci, \
	       CONVERT(CAST( \
	           CASE \
	               WHEN v.expires_at IS NOT NULL THEN GREATEST(1, TIMESTAMPDIFF(SECOND, CURRENT_TIMESTAMP, v.expires_at)) \
	               WHEN v.snap_validity_unit = 'hours' THEN (COALESCE(v.snap_validity_value, 24) * 3600) \
	               WHEN v.snap_validity_unit = 'minutes' THEN (COALESCE(v.snap_validity_value, 60) * 60) \
	               WHEN COALESCE(v.snap_validity_days, 0) > 0 THEN (v.snap_validity_days * 86400) \
	               WHEN COALESCE(p.validity_days, 0) > 0 THEN (p.validity_days * 86400) \
	               ELSE 2592000 \
	           END \
	       AS CHAR) USING utf8mb4) COLLATE utf8mb4_unicode_ci, \
	       _utf8mb4':=' COLLATE utf8mb4_unicode_ci \
	FROM wisp_vouchers v \
	LEFT JOIN wisp_packages p ON v.package_id = p.id \
	WHERE v.username = '%{SQL-User-Name}' \
	  AND (v.expires_at IS NULL OR v.expires_at > CURRENT_TIMESTAMP) \
	UNION ALL \
	SELECT 999992, _utf8mb4'%{SQL-User-Name}' COLLATE utf8mb4_unicode_ci, _utf8mb4'Mikrotik-Total-Limit' COLLATE utf8mb4_unicode_ci, \
	       CONVERT(CAST(MOD(GREATEST(0, (COALESCE(p.volume_quota_mb, 0) + COALESCE(s.extra_quota_mb, 0)) * 1048576 - SUM(COALESCE(a.acctinputoctets + a.acctoutputoctets, 0))), 4294967296) AS CHAR) USING utf8mb4) COLLATE utf8mb4_unicode_ci, \
	       _utf8mb4':=' COLLATE utf8mb4_unicode_ci \
	FROM wisp_subscribers s \
	LEFT JOIN wisp_packages p ON s.package_id = p.id \
	LEFT JOIN radacct a ON s.username = a.username AND (s.last_renewed_at IS NULL OR a.acctstarttime >= s.last_renewed_at) \
	WHERE s.username = '%{SQL-User-Name}' AND (COALESCE(p.volume_quota_mb, 0) + COALESCE(s.extra_quota_mb, 0)) > 0 \
	GROUP BY s.id, p.volume_quota_mb, s.extra_quota_mb \
	HAVING (COALESCE(p.volume_quota_mb, 0) + COALESCE(s.extra_quota_mb, 0)) * 1048576 > SUM(COALESCE(a.acctinputoctets + a.acctoutputoctets, 0)) \
	UNION ALL \
	SELECT 999996, _utf8mb4'%{SQL-User-Name}' COLLATE utf8mb4_unicode_ci, _utf8mb4'Mikrotik-Total-Limit-Gigawords' COLLATE utf8mb4_unicode_ci, \
	       CONVERT(CAST(FLOOR(GREATEST(0, (COALESCE(p.volume_quota_mb, 0) + COALESCE(s.extra_quota_mb, 0)) * 1048576 - SUM(COALESCE(a.acctinputoctets + a.acctoutputoctets, 0))) / 4294967296) AS CHAR) USING utf8mb4) COLLATE utf8mb4_unicode_ci, \
	       _utf8mb4':=' COLLATE utf8mb4_unicode_ci \
	FROM wisp_subscribers s \
	LEFT JOIN wisp_packages p ON s.package_id = p.id \
	LEFT JOIN radacct a ON s.username = a.username AND (s.last_renewed_at IS NULL OR a.acctstarttime >= s.last_renewed_at) \
	WHERE s.username = '%{SQL-User-Name}' AND (COALESCE(p.volume_quota_mb, 0) + COALESCE(s.extra_quota_mb, 0)) > 0 \
	GROUP BY s.id, p.volume_quota_mb, s.extra_quota_mb \
	HAVING (COALESCE(p.volume_quota_mb, 0) + COALESCE(s.extra_quota_mb, 0)) * 1048576 >= 4294967296 \
	UNION ALL \
	SELECT 999993, _utf8mb4'%{SQL-User-Name}' COLLATE utf8mb4_unicode_ci, _utf8mb4'Session-Timeout' COLLATE utf8mb4_unicode_ci, \
	       CONVERT(CAST( \
	           CASE \
	               WHEN s.expires_at IS NOT NULL THEN GREATEST(1, TIMESTAMPDIFF(SECOND, CURRENT_TIMESTAMP, s.expires_at)) \
	               WHEN COALESCE(p.validity_days, 0) > 0 THEN (p.validity_days * 86400) \
	               ELSE 2592000 \
	           END \
	       AS CHAR) USING utf8mb4) COLLATE utf8mb4_unicode_ci, \
	       _utf8mb4':=' COLLATE utf8mb4_unicode_ci \
	FROM wisp_subscribers s \
	LEFT JOIN wisp_packages p ON s.package_id = p.id \
	WHERE s.username = '%{SQL-User-Name}' \
	  AND (s.expires_at IS NULL OR s.expires_at > CURRENT_TIMESTAMP)"

authorize_group_check_query = "\
	SELECT id, groupname, attribute, \
	Value, op \
	FROM ${groupcheck_table} \
	WHERE groupname = '%{${group_attribute}}' \
	ORDER BY id"

authorize_group_reply_query = "\
	SELECT id, groupname, attribute, \
	value, op \
	FROM ${groupreply_table} \
	WHERE groupname = '%{${group_attribute}}' \
	ORDER BY id"

group_membership_query = "\
	SELECT groupname \
	FROM ${usergroup_table} \
	WHERE username = '%{SQL-User-Name}' \
	ORDER BY priority"

simul_count_query = "\
	SELECT COUNT(*) \
	FROM ${acct_table1} a \
	LEFT OUTER JOIN nasreload n USING (nasipaddress) \
	WHERE username = '%{SQL-User-Name}' \
	AND acctstoptime IS NULL \
	AND (n.reloadtime IS NULL OR a.acctstarttime >= n.reloadtime)"

simul_verify_query = "\
	SELECT radacctid, acctsessionid, username, \
	nasipaddress, nasportid, framedipaddress, \
	callingstationid, framedprotocol \
	FROM ${acct_table1} \
	WHERE username = '%{SQL-User-Name}' \
	AND acctstoptime IS NULL"

accounting {
	reference = "%{tolower:type.%{%{Acct-Status-Type}:-%{Request-Processing-Stage}}.query}"

	type {
		accounting-on {
			query = "\
				UPDATE ${....acct_table1} \
				SET \
					acctstoptime = NOW(), \
					acctsessiontime = UNIX_TIMESTAMP(NOW()) - UNIX_TIMESTAMP(acctstarttime), \
					acctterminatecause = '%{%{Acct-Terminate-Cause}:-NAS-Reset}' \
				WHERE acctstoptime IS NULL \
				AND (nasipaddress = '%{NAS-IP-Address}' OR nasipaddress = '%{Packet-Src-IP-Address}')"
		}

		accounting-off {
			query = "\
				UPDATE ${....acct_table1} \
				SET \
					acctstoptime = NOW(), \
					acctsessiontime = UNIX_TIMESTAMP(NOW()) - UNIX_TIMESTAMP(acctstarttime), \
					acctterminatecause = '%{%{Acct-Terminate-Cause}:-NAS-Reset}' \
				WHERE acctstoptime IS NULL \
				AND (nasipaddress = '%{NAS-IP-Address}' OR nasipaddress = '%{Packet-Src-IP-Address}')"
		}

		start {
			query = "\
				INSERT INTO ${....acct_table1} ( \
					acctsessionid, acctuniqueid, username, \
					realm, nasipaddress, nasportid, \
					nasporttype, acctstarttime, acctupdatetime, \
					acctstoptime, acctsessiontime, acctauthentic, \
					connectinfo_start, connectinfo_stop, acctinputoctets, \
					acctoutputoctets, calledstationid, callingstationid, \
					acctterminatecause, servicetype, framedprotocol, \
					framedipaddress, framedipv6address, framedipv6prefix, \
					framedinterfaceid, delegatedipv6prefix, class \
				) \
				VALUES ( \
					'%{Acct-Session-Id}', \
					'%{Acct-Unique-Session-Id}', \
					'%{SQL-User-Name}', \
					'%{Realm}', \
					'%{NAS-IP-Address}', \
					'%{%{NAS-Port-ID}:-%{NAS-Port}}', \
					'%{NAS-Port-Type}', \
					NOW(), \
					NOW(), \
					NULL, \
					0, \
					'%{Acct-Authentic}', \
					'%{Connect-Info}', \
					'', \
					0, \
					0, \
					'%{Called-Station-Id}', \
					'%{Calling-Station-Id}', \
					'', \
					'%{Service-Type}', \
					'%{Framed-Protocol}', \
					'%{Framed-IP-Address}', \
					'%{Framed-IPv6-Address}', \
					'%{Framed-IPv6-Prefix}', \
					'%{Framed-Interface-Id}', \
					'%{Delegated-IPv6-Prefix}', \
					'%{Class}' \
				) \
				ON DUPLICATE KEY UPDATE \
					acctstarttime = VALUES(acctstarttime), \
					acctupdatetime = VALUES(acctupdatetime), \
					connectinfo_start = VALUES(connectinfo_start)"
		}

		interim-update {
			query = "\
				UPDATE ${....acct_table1} \
				SET \
					framedipaddress = '%{Framed-IP-Address}', \
					framedipv6address = '%{Framed-IPv6-Address}', \
					framedipv6prefix = '%{Framed-IPv6-Prefix}', \
					framedinterfaceid = '%{Framed-Interface-Id}', \
					delegatedipv6prefix = '%{Delegated-IPv6-Prefix}', \
					acctsessiontime = %{%{Acct-Session-Time}:-NULL}, \
					acctinterval = (UNIX_TIMESTAMP(NOW()) - UNIX_TIMESTAMP(COALESCE(acctupdatetime, acctstarttime))), \
					acctupdatetime = NOW(), \
					acctstoptime = NULL, \
					acctinputoctets = %{%{Acct-Input-Gigawords}:-0} * 4294967296 + %{%{Acct-Input-Octets}:-0}, \
					acctoutputoctets = %{%{Acct-Output-Gigawords}:-0} * 4294967296 + %{%{Acct-Output-Octets}:-0} \
				WHERE acctuniqueid = '%{Acct-Unique-Session-Id}'"

			query = "\
				INSERT INTO ${....acct_table1} ( \
