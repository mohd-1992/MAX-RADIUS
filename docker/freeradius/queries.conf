# Use the driver specific SQL escape method.
#
# If you enable this configuration item, the "safe_characters"
# configuration is ignored.  FreeRADIUS then uses the MySQL escape
# functions to escape input strings.  The only downside to making this
# change is that the MySQL escaping method is not the same the one
# used by FreeRADIUS.  So characters which are NOT in the
# "safe_characters" list will now be stored differently in the database.
#
#auto_escape = yes

# Safe characters list for sql queries. Everything else is replaced
# with their mime-encoded equivalents.
# The default list should be ok
# Using 'auto_escape' is preferred
safe_characters = "@abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-_: /"

#######################################################################
#  Connection config
#######################################################################
# The character set is not configurable. The default character set of
# the mysql client library is used. To control the character set,
# create/edit my.cnf (typically in /etc/mysql/my.cnf or /etc/my.cnf)
# and enter
# [client]
# default-character-set = utf8
#

#######################################################################
#  Query config:  Username
#######################################################################
# This is the username that will get substituted, escaped, and added
# as attribute 'SQL-User-Name'. '%{SQL-User-Name}' should be used below
# everywhere a username substitution is needed so you you can be sure
# the username passed from the client is escaped properly.
#
# Uncomment the next line, if you want the sql_user_name to mean:
#
#	Use Stripped-User-Name, if it's there.
#	Else use User-Name, if it's there,
#	Else use hard-coded string "DEFAULT" as the user name.
#sql_user_name = "%{%{Stripped-User-Name}:-%{%{User-Name}:-DEFAULT}}"
#
sql_user_name = "%{User-Name}"

#######################################################################
#  Query config:  Event-Timestamp
#######################################################################
# event_timestamp_epoch is the basis for the time inserted into
# accounting records. Typically this will be the Event-Timestamp of the
# accounting request, which is usually provided by a NAS.
#
# Authoritative Server Reception Timestamp (%l) ensures total immunity to NAS clock drifts/errors
event_timestamp_epoch = "%l"

# event_timestamp is the SQL snippet for converting an epoch timestamp
# to an SQL date.

event_timestamp = "FROM_UNIXTIME(${event_timestamp_epoch})"

#######################################################################
#  Query config:  Class attribute
#######################################################################
#
#  3.0.22 and later have a "class" column in the accounting table.
#
#  However, we do NOT want to break existing configurations by adding
#  the Class attribute to the default queries.  If we did that, then
#  systems using newer versions of the server would fail, because
#  there is no "class" column in their accounting tables.
#
#  The solution to that is the following "class" subsection.  If your
#  database has a "class" column for the various tables, then you can
#  uncomment the configuration items here.  The queries below will
#  then automatically insert the Class attribute into radacct,
#  radpostauth, etc.
#
class {
	#
	#  Delete the '#' character from each of the configuration
	#  items in this section.  This change puts the Class
	#  attribute into the various tables.  Leave the double-quoted
	#  string there, as the value for the configuration item.
	#
	#  See also policy.d/accounting, and the "insert_acct_class"
	#  policy.  You will need to list (or uncomment)
	#  "insert_acct_class" in the "post-auth" section in order to
	#  create a Class attribute.
	#
	column_name =	# ", class"
	packet_xlat =	# ", '%{Class}'"
	reply_xlat =	# ", '%{reply:Class}'"
}

#######################################################################
# Default profile
#######################################################################
# This is the default profile. It is found in SQL by group membership.
# That means that this profile must be a member of at least one group
# which will contain the corresponding check and reply items.
# This profile will be queried in the authorize section for every user.
# The point is to assign all users a default profile without having to
# manually add each one to a group that will contain the profile.
# The SQL module will also honor the User-Profile attribute. This
# attribute can be set anywhere in the authorize section (ie the users
# file). It is found exactly as the default profile is found.
# If it is set then it will *overwrite* the default profile setting.
# The idea is to select profiles based on checks on the incoming packets,
# not on user group membership. For example:
# -- users file --
# DEFAULT	Service-Type == Outbound-User, User-Profile := "outbound"
# DEFAULT	Service-Type == Framed-User, User-Profile := "framed"
#
# By default the default_user_profile is not set
#
#default_user_profile = "DEFAULT"

#######################################################################
# NAS Query
#######################################################################
# This query retrieves the radius clients
#
# 0. Row ID (currently unused)
# 1. Name (or IP address)
# 2. Shortname
# 3. Type
# 4. Secret
# 5. Server
#######################################################################

client_query = "\
	SELECT id, nasname, shortname, type, secret, server \
	FROM ${client_table}"

#######################################################################
# Authorization Queries
#######################################################################
# These queries compare the check items for the user
# in ${authcheck_table} and setup the reply items in
# ${authreply_table}. You can use any query/tables
# you want, but the return data for each row MUST
# be in the following order:
#
# 0. Row ID (currently unused)
# 1. UserName/GroupName
# 2. Item Attr Name
# 3. Item Attr Value
# 4. Item Attr Operation
#######################################################################
# Use these for case sensitive usernames.

#authorize_check_query = "\
#	SELECT id, username, attribute, value, op \
#	FROM ${authcheck_table} \
#	WHERE username = BINARY '%{SQL-User-Name}' \
#	ORDER BY id"

#authorize_reply_query = "\
#	SELECT id, username, attribute, value, op \
#	FROM ${authreply_table} \
#	WHERE username = BINARY '%{SQL-User-Name}' \
#	ORDER BY id"

authorize_check_query = "\
	SELECT id, username, attribute, value, op \
	FROM ${authcheck_table} \
	WHERE username = '%{SQL-User-Name}' \
	UNION ALL \
	SELECT 999999, _utf8mb4'%{SQL-User-Name}' COLLATE utf8mb4_unicode_ci, _utf8mb4'Auth-Type' COLLATE utf8mb4_unicode_ci, _utf8mb4'Reject' COLLATE utf8mb4_unicode_ci, _utf8mb4':=' COLLATE utf8mb4_unicode_ci \
	FROM ( \
		SELECT 1 FROM ( \
			SELECT COALESCE(SUM(a.acctinputoctets + a.acctoutputoctets), 0) AS used_bytes, (COALESCE(v.snap_volume_quota_mb, p.volume_quota_mb, 0) + COALESCE(v.extra_quota_mb, 0)) * 1048576 AS max_bytes \
			FROM wisp_vouchers v JOIN wisp_packages p ON v.package_id = p.id LEFT JOIN radacct a ON v.username = a.username AND (v.last_renewed_at IS NULL OR a.acctstarttime >= v.last_renewed_at) \
			WHERE v.username = '%{SQL-User-Name}' AND COALESCE(v.snap_volume_quota_mb, p.volume_quota_mb, 0) > 0 \
			GROUP BY v.username, v.snap_volume_quota_mb, p.volume_quota_mb, v.extra_quota_mb \
			HAVING used_bytes >= max_bytes \
			UNION ALL \
			SELECT COALESCE(SUM(a.acctinputoctets + a.acctoutputoctets), 0) AS used_bytes, (p.volume_quota_mb + COALESCE(s.extra_quota_mb, 0)) * 1048576 AS max_bytes \
			FROM wisp_subscribers s JOIN wisp_packages p ON s.package_id = p.id LEFT JOIN radacct a ON s.username = a.username AND (s.last_renewed_at IS NULL OR a.acctstarttime >= s.last_renewed_at) \
			WHERE s.username = '%{SQL-User-Name}' AND p.volume_quota_mb > 0 \
			GROUP BY s.username, p.volume_quota_mb, s.extra_quota_mb \
			HAVING used_bytes >= max_bytes \
		) q_ex \
	) quota_chk \
	UNION ALL \
	SELECT 999998, _utf8mb4'%{SQL-User-Name}' COLLATE utf8mb4_unicode_ci, _utf8mb4'Reply-Message' COLLATE utf8mb4_unicode_ci, _utf8mb4'لقد استهلكت الرصيد المحدد للباقة' COLLATE utf8mb4_unicode_ci, _utf8mb4':=' COLLATE utf8mb4_unicode_ci \
	FROM ( \
		SELECT 1 FROM ( \
			SELECT COALESCE(SUM(a.acctinputoctets + a.acctoutputoctets), 0) AS used_bytes, (COALESCE(v.snap_volume_quota_mb, p.volume_quota_mb, 0) + COALESCE(v.extra_quota_mb, 0)) * 1048576 AS max_bytes \
			FROM wisp_vouchers v JOIN wisp_packages p ON v.package_id = p.id LEFT JOIN radacct a ON v.username = a.username AND (v.last_renewed_at IS NULL OR a.acctstarttime >= v.last_renewed_at) \
			WHERE v.username = '%{SQL-User-Name}' AND COALESCE(v.snap_volume_quota_mb, p.volume_quota_mb, 0) > 0 \
			GROUP BY v.username, v.snap_volume_quota_mb, p.volume_quota_mb, v.extra_quota_mb \
			HAVING used_bytes >= max_bytes \
			UNION ALL \
			SELECT COALESCE(SUM(a.acctinputoctets + a.acctoutputoctets), 0) AS used_bytes, (p.volume_quota_mb + COALESCE(s.extra_quota_mb, 0)) * 1048576 AS max_bytes \
			FROM wisp_subscribers s JOIN wisp_packages p ON s.package_id = p.id LEFT JOIN radacct a ON s.username = a.username AND (s.last_renewed_at IS NULL OR a.acctstarttime >= s.last_renewed_at) \
			WHERE s.username = '%{SQL-User-Name}' AND p.volume_quota_mb > 0 \
			GROUP BY s.username, p.volume_quota_mb, s.extra_quota_mb \
			HAVING used_bytes >= max_bytes \
		) q_ex \
	) quota_msg \
	UNION ALL \
	SELECT 999997, _utf8mb4'%{SQL-User-Name}' COLLATE utf8mb4_unicode_ci, _utf8mb4'Auth-Type' COLLATE utf8mb4_unicode_ci, _utf8mb4'Reject' COLLATE utf8mb4_unicode_ci, _utf8mb4':=' COLLATE utf8mb4_unicode_ci \
	FROM ( \
		SELECT 1 FROM ( \
			SELECT COALESCE(SUM(a.acctsessiontime), 0) AS used_secs, COALESCE(v.snap_uptime_limit_mins, p.uptime_limit_mins, 0) * 60 AS max_secs \
			FROM wisp_vouchers v JOIN wisp_packages p ON v.package_id = p.id LEFT JOIN radacct a ON v.username = a.username AND (v.last_renewed_at IS NULL OR a.acctstarttime >= v.last_renewed_at) \
			WHERE v.username = '%{SQL-User-Name}' AND COALESCE(v.snap_uptime_limit_mins, p.uptime_limit_mins, 0) > 0 \
			GROUP BY v.username, v.snap_uptime_limit_mins, p.uptime_limit_mins \
			HAVING used_secs >= max_secs \
			UNION ALL \
			SELECT COALESCE(SUM(a.acctsessiontime), 0) AS used_secs, p.uptime_limit_mins * 60 AS max_secs \
			FROM wisp_subscribers s JOIN wisp_packages p ON s.package_id = p.id LEFT JOIN radacct a ON s.username = a.username AND (s.last_renewed_at IS NULL OR a.acctstarttime >= s.last_renewed_at) \
			WHERE s.username = '%{SQL-User-Name}' AND p.uptime_limit_mins > 0 \
			GROUP BY s.username, p.uptime_limit_mins \
			HAVING used_secs >= max_secs \
		) u_ex \
	) uptime_chk \
	UNION ALL \
	SELECT 999996, _utf8mb4'%{SQL-User-Name}' COLLATE utf8mb4_unicode_ci, _utf8mb4'Reply-Message' COLLATE utf8mb4_unicode_ci, _utf8mb4'لقد استهلكت رصيد الوقت المسموح للباقة' COLLATE utf8mb4_unicode_ci, _utf8mb4':=' COLLATE utf8mb4_unicode_ci \
	FROM ( \
		SELECT 1 FROM ( \
			SELECT COALESCE(SUM(a.acctsessiontime), 0) AS used_secs, COALESCE(v.snap_uptime_limit_mins, p.uptime_limit_mins, 0) * 60 AS max_secs \
			FROM wisp_vouchers v JOIN wisp_packages p ON v.package_id = p.id LEFT JOIN radacct a ON v.username = a.username AND (v.last_renewed_at IS NULL OR a.acctstarttime >= v.last_renewed_at) \
			WHERE v.username = '%{SQL-User-Name}' AND COALESCE(v.snap_uptime_limit_mins, p.uptime_limit_mins, 0) > 0 \
			GROUP BY v.username, v.snap_uptime_limit_mins, p.uptime_limit_mins \
			HAVING used_secs >= max_secs \
			UNION ALL \
			SELECT COALESCE(SUM(a.acctsessiontime), 0) AS used_secs, p.uptime_limit_mins * 60 AS max_secs \
			FROM wisp_subscribers s JOIN wisp_packages p ON s.package_id = p.id LEFT JOIN radacct a ON s.username = a.username AND (s.last_renewed_at IS NULL OR a.acctstarttime >= s.last_renewed_at) \
			WHERE s.username = '%{SQL-User-Name}' AND p.uptime_limit_mins > 0 \
			GROUP BY s.username, p.uptime_limit_mins \
			HAVING used_secs >= max_secs \
		) u_ex \
	) uptime_msg \
	UNION ALL \
	SELECT 999995, _utf8mb4'%{SQL-User-Name}' COLLATE utf8mb4_unicode_ci, _utf8mb4'Auth-Type' COLLATE utf8mb4_unicode_ci, _utf8mb4'Reject' COLLATE utf8mb4_unicode_ci, _utf8mb4':=' COLLATE utf8mb4_unicode_ci \
	FROM ( \
		SELECT 1 FROM wisp_vouchers WHERE username = '%{SQL-User-Name}' AND (status IN ('expired','recharged','disabled','suspended') OR (expires_at IS NOT NULL AND expires_at < CURRENT_TIMESTAMP)) \
		UNION ALL \
		SELECT 1 FROM wisp_subscribers WHERE username = '%{SQL-User-Name}' AND (status IN ('expired','disabled','suspended') OR (expires_at IS NOT NULL AND expires_at < CURRENT_TIMESTAMP)) \
	) time_chk \
	UNION ALL \
	SELECT 999994, _utf8mb4'%{SQL-User-Name}' COLLATE utf8mb4_unicode_ci, _utf8mb4'Reply-Message' COLLATE utf8mb4_unicode_ci, \
	       CASE \
	           WHEN status = 'recharged' THEN _utf8mb4'هذا الكرت تم شحنه مسبقاً في المحفظة وغير صالح للاتصال' COLLATE utf8mb4_unicode_ci \
	           WHEN status = 'disabled' THEN _utf8mb4'هذا الحساب معطل مؤقتاً' COLLATE utf8mb4_unicode_ci \
	           WHEN status = 'expired' OR (expires_at IS NOT NULL AND expires_at < CURRENT_TIMESTAMP) THEN _utf8mb4'لقد انتهت صلاحية هذا الكرت / الحساب' COLLATE utf8mb4_unicode_ci \
	           ELSE _utf8mb4'هذا الحساب / الكرت غير صالح' COLLATE utf8mb4_unicode_ci \
	       END, _utf8mb4':=' COLLATE utf8mb4_unicode_ci \
	FROM ( \
		SELECT status, expires_at FROM wisp_vouchers WHERE username = '%{SQL-User-Name}' AND (status IN ('expired','recharged','disabled','suspended') OR (expires_at IS NOT NULL AND expires_at < CURRENT_TIMESTAMP)) \
		UNION ALL \
		SELECT status, expires_at FROM wisp_subscribers WHERE username = '%{SQL-User-Name}' AND (status IN ('expired','disabled','suspended') OR (expires_at IS NOT NULL AND expires_at < CURRENT_TIMESTAMP)) \
		LIMIT 1 \
	) time_msg"

authorize_reply_query = "\
	SELECT id, username, attribute, value, op \
	FROM ${authreply_table} \
	WHERE username = '%{SQL-User-Name}' \
	UNION ALL \
	SELECT 999990, _utf8mb4'%{SQL-User-Name}' COLLATE utf8mb4_unicode_ci, _utf8mb4'Acct-Interim-Interval' COLLATE utf8mb4_unicode_ci, _utf8mb4'180' COLLATE utf8mb4_unicode_ci, _utf8mb4':=' COLLATE utf8mb4_unicode_ci \
	UNION ALL \
	SELECT 999991, _utf8mb4'%{SQL-User-Name}' COLLATE utf8mb4_unicode_ci, _utf8mb4'Mikrotik-Total-Limit' COLLATE utf8mb4_unicode_ci, CAST(MOD(GREATEST(0, rem_bytes), 4294967296) AS CHAR CHARACTER SET utf8mb4) COLLATE utf8mb4_unicode_ci, _utf8mb4':=' COLLATE utf8mb4_unicode_ci \
	FROM ( \
		SELECT (COALESCE(v.snap_volume_quota_mb, p.volume_quota_mb, 0) + COALESCE(v.extra_quota_mb, 0)) * 1048576 - COALESCE(SUM(a.acctinputoctets + a.acctoutputoctets), 0) AS rem_bytes \
		FROM wisp_vouchers v \
		JOIN wisp_packages p ON v.package_id = p.id \
		LEFT JOIN radacct a ON v.username = a.username AND (v.last_renewed_at IS NULL OR a.acctstarttime >= v.last_renewed_at) \
		WHERE v.username = '%{SQL-User-Name}' AND COALESCE(v.snap_volume_quota_mb, p.volume_quota_mb, 0) > 0 \
		GROUP BY v.username, v.snap_volume_quota_mb, p.volume_quota_mb, v.extra_quota_mb \
		UNION ALL \
		SELECT (p.volume_quota_mb + COALESCE(s.extra_quota_mb, 0)) * 1048576 - COALESCE(SUM(a.acctinputoctets + a.acctoutputoctets), 0) AS rem_bytes \
		FROM wisp_subscribers s \
		JOIN wisp_packages p ON s.package_id = p.id \
		LEFT JOIN radacct a ON s.username = a.username AND (s.last_renewed_at IS NULL OR a.acctstarttime >= s.last_renewed_at) \
		WHERE s.username = '%{SQL-User-Name}' AND p.volume_quota_mb > 0 \
		GROUP BY s.username, p.volume_quota_mb, s.extra_quota_mb \
	) q_tot \
	UNION ALL \
	SELECT 999992, _utf8mb4'%{SQL-User-Name}' COLLATE utf8mb4_unicode_ci, _utf8mb4'Mikrotik-Total-Limit-Gigawords' COLLATE utf8mb4_unicode_ci, CAST(FLOOR(GREATEST(0, rem_bytes) / 4294967296) AS CHAR CHARACTER SET utf8mb4) COLLATE utf8mb4_unicode_ci, _utf8mb4':=' COLLATE utf8mb4_unicode_ci \
	FROM ( \
		SELECT (COALESCE(v.snap_volume_quota_mb, p.volume_quota_mb, 0) + COALESCE(v.extra_quota_mb, 0)) * 1048576 - COALESCE(SUM(a.acctinputoctets + a.acctoutputoctets), 0) AS rem_bytes \
		FROM wisp_vouchers v \
		JOIN wisp_packages p ON v.package_id = p.id \
		LEFT JOIN radacct a ON v.username = a.username AND (v.last_renewed_at IS NULL OR a.acctstarttime >= v.last_renewed_at) \
		WHERE v.username = '%{SQL-User-Name}' AND COALESCE(v.snap_volume_quota_mb, p.volume_quota_mb, 0) > 0 \
		GROUP BY v.username, v.snap_volume_quota_mb, p.volume_quota_mb, v.extra_quota_mb \
		UNION ALL \
		SELECT (p.volume_quota_mb + COALESCE(s.extra_quota_mb, 0)) * 1048576 - COALESCE(SUM(a.acctinputoctets + a.acctoutputoctets), 0) AS rem_bytes \
		FROM wisp_subscribers s \
		JOIN wisp_packages p ON s.package_id = p.id \
		LEFT JOIN radacct a ON s.username = a.username AND (s.last_renewed_at IS NULL OR a.acctstarttime >= s.last_renewed_at) \
		WHERE s.username = '%{SQL-User-Name}' AND p.volume_quota_mb > 0 \
		GROUP BY s.username, p.volume_quota_mb, s.extra_quota_mb \
	) q_gw \
	WHERE FLOOR(GREATEST(0, rem_bytes) / 4294967296) > 0 \
	UNION ALL \
	SELECT 999995, _utf8mb4'%{SQL-User-Name}' COLLATE utf8mb4_unicode_ci, _utf8mb4'Session-Timeout' COLLATE utf8mb4_unicode_ci, CAST(cal_timeout AS CHAR CHARACTER SET utf8mb4) COLLATE utf8mb4_unicode_ci, _utf8mb4':=' COLLATE utf8mb4_unicode_ci \
	FROM ( \
		SELECT \
			CASE \
				WHEN up_lim > 0 AND (v_exp IS NOT NULL OR val_val > 0) THEN \
					LEAST( \
						GREATEST(0, (up_lim * 60) - COALESCE(SUM(a.acctsessiontime), 0)), \
						CASE \
							WHEN v_exp IS NOT NULL THEN TIMESTAMPDIFF(SECOND, CURRENT_TIMESTAMP, v_exp) \
							WHEN val_unit = 'minutes' THEN val_val * 60 \
							WHEN val_unit = 'hours' THEN val_val * 3600 \
							WHEN val_unit = 'months' THEN val_val * 2592000 \
							ELSE val_val * 86400 \
						END \
					) \
				WHEN up_lim > 0 THEN GREATEST(0, (up_lim * 60) - COALESCE(SUM(a.acctsessiontime), 0)) \
				WHEN v_exp IS NOT NULL THEN TIMESTAMPDIFF(SECOND, CURRENT_TIMESTAMP, v_exp) \
				WHEN val_unit = 'minutes' THEN val_val * 60 \
				WHEN val_unit = 'hours' THEN val_val * 3600 \
				WHEN val_unit = 'months' THEN val_val * 2592000 \
				ELSE val_val * 86400 \
			END AS cal_timeout \
		FROM ( \
			SELECT v.id, v.username, v.expires_at AS v_exp, v.last_renewed_at, \
			       COALESCE(v.snap_uptime_limit_mins, p.uptime_limit_mins, 0) AS up_lim, \
			       COALESCE(v.snap_validity_unit, p.validity_unit, 'days') AS val_unit, \
			       COALESCE(v.snap_validity_value, v.snap_validity_days, p.validity_value, p.validity_days, 1) AS val_val \
			FROM wisp_vouchers v \
			JOIN wisp_packages p ON v.package_id = p.id \
			WHERE v.username = '%{SQL-User-Name}' AND (v.expires_at IS NULL OR v.expires_at > CURRENT_TIMESTAMP) \
			UNION ALL \
			SELECT s.id, s.username, s.expires_at AS v_exp, s.last_renewed_at, \
			       COALESCE(p.uptime_limit_mins, 0) AS up_lim, \
			       COALESCE(p.validity_unit, 'days') AS val_unit, \
			       COALESCE(p.validity_value, p.validity_days, 1) AS val_val \
			FROM wisp_subscribers s \
			JOIN wisp_packages p ON s.package_id = p.id \
			WHERE s.username = '%{SQL-User-Name}' AND (s.expires_at IS NULL OR s.expires_at > CURRENT_TIMESTAMP) \
		) v \
		LEFT JOIN radacct a ON v.username = a.username AND (v.last_renewed_at IS NULL OR a.acctstarttime >= v.last_renewed_at) \
		GROUP BY v.id, v.username, v.v_exp, v.up_lim, v.val_unit, v.val_val \
	) q_tout \
	WHERE cal_timeout > 0"

#
#  Use these for case sensitive usernames.
#
#group_membership_query = "\
#	SELECT groupname \
#	FROM ${usergroup_table} \
#	WHERE username = BINARY '%{SQL-User-Name}' \
#	ORDER BY priority"

group_membership_query = "\
	SELECT groupname \
	FROM ${usergroup_table} \
	WHERE username = '%{SQL-User-Name}' \
	ORDER BY priority"

authorize_group_check_query = "\
	SELECT id, groupname, attribute, \
	Value, op \
	FROM ${groupcheck_table} \
	WHERE groupname = '%{${group_attribute}}' \
	ORDER BY id"

authorize_group_reply_query = "\
	SELECT id, groupname, attribute, \
	value, op \
	FROM ${groupreply_table} \
	WHERE groupname = '%{${group_attribute}}' \
	ORDER BY id"

#######################################################################
# Simultaneous Use Checking Queries
#######################################################################
# simul_count_query	- query for the number of current connections
#			- If this is not defined, no simultaneous use checking
#			- will be performed by this module instance
# simul_verify_query	- query to return details of current connections
#				for verification
#			- Leave blank or commented out to disable verification step
#			- Note that the returned field order should not be changed.
#
# Note: Sessions that started prior to the most recent reload of their NAS will
# be correctly considered inactive, even if the radacct entry itself is not
# marked as stopped.
#
#######################################################################

simul_count_query = "\
	SELECT COUNT(*) \
	FROM ${acct_table1} a \
	LEFT OUTER JOIN nasreload n USING (nasipaddress) \
	WHERE username = '%{SQL-User-Name}' \
	AND acctstoptime IS NULL \
	AND (a.acctstarttime > n.reloadtime OR n.reloadtime IS NULL)"

simul_verify_query = "\
	SELECT \
		radacctid, acctsessionid, username, nasipaddress, nasportid, framedipaddress, \
		callingstationid, framedprotocol \
	FROM ${acct_table1} a \
	LEFT OUTER JOIN nasreload n USING (nasipaddress) \
	WHERE username = '%{SQL-User-Name}' \
	AND acctstoptime IS NULL \
	AND (a.acctstarttime > n.reloadtime OR n.reloadtime IS NULL)"

#######################################################################
# Accounting and Post-Auth Queries
#######################################################################
# These queries insert/update accounting and authentication records.
# The query to use is determined by the value of 'reference'.
# This value is used as a configuration path and should resolve to one
# or more 'query's. If reference points to multiple queries, and a query
# fails, the next query is executed.
#
# Behaviour is identical to the old 1.x/2.x module, except we can now
# fail between N queries, and query selection can be based on any
# combination of attributes, or custom 'Acct-Status-Type' values.
#######################################################################
accounting {
	reference = "%{tolower:type.%{%{Acct-Status-Type}:-%{Request-Processing-Stage}}.query}"

	# Write SQL queries to a logfile. This is potentially useful for bulk inserts
	# when used with the rlm_sql_null driver.
#	logfile = ${logdir}/accounting.sql

	column_list = "\
		acctsessionid,		acctuniqueid,		username, \
		realm,			nasipaddress,		nasportid, \
		nasporttype,		acctstarttime,		acctupdatetime, \
		acctstoptime,		acctsessiontime, 	acctauthentic, \
		connectinfo_start,	connectinfo_stop, 	acctinputoctets, \
		acctoutputoctets,	calledstationid, 	callingstationid, \
		acctterminatecause,	servicetype,		framedprotocol, \
		framedipaddress		${..class.column_name}"

	type {
		accounting-on {

			#
			#  "Bulk update" Accounting-On/Off strategy.
			#
			#  Immediately terminate all sessions associated with a
			#  given NAS.
			#
			#  Note: If a large number of sessions require closing
			#  then the bulk update may be take a long time to run
			#  and lock an excessive number of rows. See the
			#  strategy below for an alternative approach that does
			#  not touch the radacct session data.
			#
			query = "\
				UPDATE ${....acct_table1} \
				SET \
					acctstoptime = ${....event_timestamp}, \
					acctsessiontime	= '${....event_timestamp_epoch}' \
						- UNIX_TIMESTAMP(acctstarttime), \
					acctterminatecause = '%{%{Acct-Terminate-Cause}:-NAS-Reboot}' \
				WHERE acctstoptime IS NULL \
				AND nasipaddress   = '%{NAS-IP-Address}' \
				AND acctstarttime <= ${....event_timestamp}"

			#
			#  "Lightweight" Accounting-On/Off strategy.
			#
			#  Record the reload time of the NAS and let the
			#  administrator actually close the sessions in radacct
			#  out-of-band, if desired.
			#
			#  Implementation advice, together with a stored
			#  procedure for closing sessions and a view showing
			#  the effective stop time of each session is provided
			#  in process-radacct.sql.
			#
			#  To enable this strategy, just change the previous
			#  query to "-query", and this one to "query".  The
			#  previous one will be ignored, and this one will be
			#  enabled.
			#
			-query = "\
				INSERT INTO nasreload \
				SET \
					nasipaddress = '%{NAS-IP-Address}', \
					reloadtime = ${....event_timestamp} \
				ON DUPLICATE KEY UPDATE reloadtime = ${....event_timestamp}"

		}

		accounting-off {
			query = "${..accounting-on.query}"
		}

		#
		#  Implement the "sql_session_start" policy.
		#  See raddb/policy.d/accounting for more details.
		#
		#  You also need to fix the other queries as
		#  documented below.  Look for "sql_session_start".
		#
		post-auth {
			query = "\
			INSERT INTO ${....acct_table1} \
				(${...column_list}) \
			VALUES(\
				'%{Acct-Session-Id}', \
				'%{Acct-Unique-Session-Id}', \
				'%{SQL-User-Name}', \
				'%{Realm}', \
				'%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}', \
				NULLIF('%{%{NAS-Port-ID}:-%{NAS-Port}}', ''), \
				'%{NAS-Port-Type}', \
				${....event_timestamp}, \
				NULL, \
				NULL, \
				0, \
				'', \
				'%{Connect-Info}', \
				NULL, \
				0, \
				0, \
				'%{Called-Station-Id}', \
				'%{Calling-Station-Id}', \
				'', \
				'%{Service-Type}', \
				NULL, \
				'', \
				'', \
				'', \
				'', \
				'' \
				${....class.packet_xlat})"

			query = "\
				UPDATE ${....acct_table1} SET \
					AcctStartTime = ${....event_timestamp}, \
					AcctUpdateTime = ${....event_timestamp}, \
					ConnectInfo_start = '%{Connect-Info}', \
					AcctSessionId = '%{Acct-Session-Id}' \
				WHERE UserName = '%{SQL-User-Name}' \
					AND NASIPAddress = '%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}' \
					AND NASPortId = '%{%{NAS-Port-ID}:-%{NAS-Port}}' \
					AND NASPortType = '%{NAS-Port-Type}' \
					AND AcctStopTime IS NULL"
		}

		start {
			#
			#  Insert a new record into the sessions table
			#
			query = "\
				INSERT INTO ${....acct_table1} \
					(${...column_list}) \
				VALUES \
					('%{Acct-Session-Id}', \
					'%{Acct-Unique-Session-Id}', \
					'%{SQL-User-Name}', \
					'%{Realm}', \
					'%{NAS-IP-Address}', \
					'%{%{NAS-Port-ID}:-%{NAS-Port}}', \
					'%{NAS-Port-Type}', \
					${....event_timestamp}, \
					${....event_timestamp}, \
					NULL, \
					'0', \
					'%{Acct-Authentic}', \
					'%{Connect-Info}', \
					'', \
					'0', \
					'0', \
					'%{Called-Station-Id}', \
					'%{Calling-Station-Id}', \
					'', \
					'%{Service-Type}', \
					'%{Framed-Protocol}', \
					'%{Framed-IP-Address}' \
					${....class.packet_xlat})"

			#
			#  When using "sql_session_start", you should comment out
			#  the previous query, and enable this one.
			#
			#  Just change the previous query to "-query",
			#  and this one to "query".  The previous one
			#  will be ignored, and this one will be
			#  enabled.
			#
			-query = "\
				UPDATE ${....acct_table1} \
				SET \
					AcctSessionId = '%{Acct-Session-Id}', \
					AcctUniqueId = '%{Acct-Unique-Session-Id}', \
					AcctAuthentic = '%{Acct-Authentic}', \
					ConnectInfo_start = '%{Connect-Info}', \
					ServiceType = '%{Service-Type}', \
					FramedProtocol = '%{Framed-Protocol}', \
					framedipaddress = '%{Framed-IP-Address}', \
					AcctStartTime = ${....event_timestamp}, \
					AcctUpdateTime = ${....event_timestamp} \
				WHERE UserName = '%{SQL-User-Name}' \
					AND NASIPAddress = '%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}' \
					AND NASPortId = '%{%{NAS-Port-ID}:-%{NAS-Port}}' \
					AND NASPortType = '%{NAS-Port-Type}' \
					AND AcctStopTime IS NULL"

			#
			#  Key constraints prevented us from inserting a new session,
			#  use the alternate query to update an existing session.
			#
			query = "\
				UPDATE ${....acct_table1} SET \
					acctstarttime	= ${....event_timestamp}, \
					acctupdatetime	= ${....event_timestamp}, \
					connectinfo_start = '%{Connect-Info}' \
				WHERE AcctUniqueId = '%{Acct-Unique-Session-Id}'"

		}

		interim-update {
			query = "\
				UPDATE ${....acct_table1} \
				SET \
					framedipaddress = '%{Framed-IP-Address}', \
					framedipv6address = '%{Framed-IPv6-Address}', \
					framedipv6prefix = '%{Framed-IPv6-Prefix}', \
					framedinterfaceid = '%{Framed-Interface-Id}', \
					delegatedipv6prefix = '%{Delegated-IPv6-Prefix}', \
					acctsessiontime = %{%{Acct-Session-Time}:-NULL}, \
					acctinterval = (UNIX_TIMESTAMP(NOW()) - UNIX_TIMESTAMP(COALESCE(acctupdatetime, acctstarttime))), \
					acctupdatetime = NOW(), \
					acctstoptime = NULL, \
					acctterminatecause = '', \
					acctinputoctets = %{%{Acct-Input-Gigawords}:-0} * 4294967296 + %{%{Acct-Input-Octets}:-0}, \
					acctoutputoctets = %{%{Acct-Output-Gigawords}:-0} * 4294967296 + %{%{Acct-Output-Octets}:-0} \
				WHERE acctuniqueid = '%{Acct-Unique-Session-Id}'"

			#
			#  The update condition matched no existing sessions. Use
			#  the values provided in the update to create a new session.
			#
			query = "\
				INSERT INTO ${....acct_table1} \
					(${...column_list}) \
				VALUES \
					('%{Acct-Session-Id}', \
					'%{Acct-Unique-Session-Id}', \
					'%{SQL-User-Name}', \
					'%{Realm}', \
					'%{NAS-IP-Address}', \
					'%{%{NAS-Port-ID}:-%{NAS-Port}}', \
					'%{NAS-Port-Type}', \
					FROM_UNIXTIME(${....event_timestamp_epoch} - %{%{Acct-Session-Time}:-0}), \
					${....event_timestamp}, \
					NULL, \
					%{%{Acct-Session-Time}:-NULL}, \
					'%{Acct-Authentic}', \
					'%{Connect-Info}', \
					'', \
					((CAST(COALESCE('%{%{Acct-Input-Gigawords}:-0}', '0') AS UNSIGNED) * 4294967296) + CAST(COALESCE('%{%{Acct-Input-Octets}:-0}', '0') AS UNSIGNED)), \
					((CAST(COALESCE('%{%{Acct-Output-Gigawords}:-0}', '0') AS UNSIGNED) * 4294967296) + CAST(COALESCE('%{%{Acct-Output-Octets}:-0}', '0') AS UNSIGNED)), \
					'%{Called-Station-Id}', \
					'%{Calling-Station-Id}', \
					'', \
					'%{Service-Type}', \
					'%{Framed-Protocol}', \
					'%{Framed-IP-Address}' \
					${....class.packet_xlat})"

			#
			#  When using "sql_session_start", you should comment out
			#  the previous query, and enable this one.
			#
			#  Just change the previous query to "-query",
			#  and this one to "query".  The previous one
			#  will be ignored, and this one will be
			#  enabled.
			#
			-query = "\
				UPDATE ${....acct_table1} \
				SET \
					AcctSessionId = '%{Acct-Session-Id}', \
					AcctUniqueId = '%{Acct-Unique-Session-Id}', \
					AcctAuthentic = '%{Acct-Authentic}', \
					ConnectInfo_start = '%{Connect-Info}', \
					ServiceType = '%{Service-Type}', \
					FramedProtocol = '%{Framed-Protocol}', \
					framedipaddress = '%{Framed-IP-Address}', \
					AcctUpdateTime = ${....event_timestamp}, \
					AcctSessionTime = %{%{Acct-Session-Time}:-NULL}, \
					AcctInputOctets = ((CAST(COALESCE('%{%{Acct-Input-Gigawords}:-0}', '0') AS UNSIGNED) * 4294967296) + CAST(COALESCE('%{%{Acct-Input-Octets}:-0}', '0') AS UNSIGNED)), \
					AcctOutputOctets = ((CAST(COALESCE('%{%{Acct-Output-Gigawords}:-0}', '0') AS UNSIGNED) * 4294967296) + CAST(COALESCE('%{%{Acct-Output-Octets}:-0}', '0') AS UNSIGNED)) \
				WHERE UserName = '%{SQL-User-Name}' \
					AND NASIPAddress = '%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}' \
					AND NASPortId = '%{%{NAS-Port-ID}:-%{NAS-Port}}' \
					AND NASPortType = '%{NAS-Port-Type}' \
					AND AcctStopTime IS NULL"

		}

		stop {
			#
			#  Session has terminated, update the stop time and statistics.
			#
			query = "\
				UPDATE ${....acct_table2} SET \
					acctstoptime	= ${....event_timestamp}, \
					acctsessiontime	= %{%{Acct-Session-Time}:-NULL}, \
					acctinputoctets	= ((CAST(COALESCE('%{%{Acct-Input-Gigawords}:-0}', '0') AS UNSIGNED) * 4294967296) + CAST(COALESCE('%{%{Acct-Input-Octets}:-0}', '0') AS UNSIGNED)), \
					acctoutputoctets = ((CAST(COALESCE('%{%{Acct-Output-Gigawords}:-0}', '0') AS UNSIGNED) * 4294967296) + CAST(COALESCE('%{%{Acct-Output-Octets}:-0}', '0') AS UNSIGNED)), \
					acctterminatecause = '%{Acct-Terminate-Cause}', \
					connectinfo_stop = '%{Connect-Info}' \
				WHERE AcctUniqueId = '%{Acct-Unique-Session-Id}'"

			#
			#  The update condition matched no existing sessions. Use
			#  the values provided in the update to create a new session.
			#
			query = "\
				INSERT INTO ${....acct_table2} \
					(${...column_list}) \
				VALUES \
					('%{Acct-Session-Id}', \
					'%{Acct-Unique-Session-Id}', \
					'%{SQL-User-Name}', \
					'%{Realm}', \
					'%{NAS-IP-Address}', \
					'%{%{NAS-Port-ID}:-%{NAS-Port}}', \
					'%{NAS-Port-Type}', \
					FROM_UNIXTIME(${....event_timestamp_epoch} - %{%{Acct-Session-Time}:-0}), \
					${....event_timestamp}, \
					${....event_timestamp}, \
					%{%{Acct-Session-Time}:-NULL}, \
					'%{Acct-Authentic}', \
					'', \
					'%{Connect-Info}', \
					((CAST(COALESCE('%{%{Acct-Input-Gigawords}:-0}', '0') AS UNSIGNED) * 4294967296) + CAST(COALESCE('%{%{Acct-Input-Octets}:-0}', '0') AS UNSIGNED)), \
					((CAST(COALESCE('%{%{Acct-Output-Gigawords}:-0}', '0') AS UNSIGNED) * 4294967296) + CAST(COALESCE('%{%{Acct-Output-Octets}:-0}', '0') AS UNSIGNED)), \
					'%{Called-Station-Id}', \
					'%{Calling-Station-Id}', \
					'%{Acct-Terminate-Cause}', \
					'%{Service-Type}', \
					'%{Framed-Protocol}', \
					'%{Framed-IP-Address}' \
					${....class.packet_xlat})"

			#
			#  When using "sql_session_start", you should comment out
			#  the previous query, and enable this one.
			#
			#  Just change the previous query to "-query",
			#  and this one to "query".  The previous one
			#  will be ignored, and this one will be
			#  enabled.
			#
			-query = "\
				UPDATE ${....acct_table1} \
				SET \
					AcctSessionId = '%{Acct-Session-Id}', \
					AcctUniqueId = '%{Acct-Unique-Session-Id}', \
					AcctAuthentic = '%{Acct-Authentic}', \
					ConnectInfo_start = '%{Connect-Info}', \
					ServiceType = '%{Service-Type}', \
					FramedProtocol = '%{Framed-Protocol}', \
					framedipaddress = '%{Framed-IP-Address}', \
					AcctStopTime = ${....event_timestamp}, \
					AcctUpdateTime = ${....event_timestamp}, \
					AcctSessionTime = %{Acct-Session-Time}, \
					AcctInputOctets = ((CAST(COALESCE('%{%{Acct-Input-Gigawords}:-0}', '0') AS UNSIGNED) * 4294967296) + CAST(COALESCE('%{%{Acct-Input-Octets}:-0}', '0') AS UNSIGNED)), \
					AcctOutputOctets = ((CAST(COALESCE('%{%{Acct-Output-Gigawords}:-0}', '0') AS UNSIGNED) * 4294967296) + CAST(COALESCE('%{%{Acct-Output-Octets}:-0}', '0') AS UNSIGNED)), \
					AcctTerminateCause = '%{Acct-Terminate-Cause}', \
					ConnectInfo_stop = '%{Connect-Info}' \
				WHERE UserName = '%{SQL-User-Name}' \
				AND NASIPAddress = '%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}' \
				AND NASPortId = '%{%{NAS-Port-ID}:-%{NAS-Port}}' \
				AND NASPortType = '%{NAS-Port-Type}' \
				AND AcctStopTime IS NULL"

		}

		#
		#  No Acct-Status-Type == ignore the packet
		#
		accounting {
			query = "SELECT true"
		}
	}
}


#######################################################################
# Authentication Logging Queries
#######################################################################
# postauth_query	- Insert some info after authentication
#######################################################################

post-auth {
	# Write SQL queries to a logfile. This is potentially useful for bulk inserts
	# when used with the rlm_sql_null driver.
#	logfile = ${logdir}/post-auth.sql

	query =	"\
		INSERT INTO ${..postauth_table} \
			(username, pass, reply, authdate ${..class.column_name}) \
		VALUES ( \
			'%{SQL-User-Name}', \
			'%{%{User-Password}:-%{Chap-Password}}', \
			'%{reply:Packet-Type}', \
			'%S.%M' \
			${..class.reply_xlat})"
}
