# MAX_ACCOUNTING_IDENTITY_V1
# Called AFTER the stock acct_unique policy.  Preserve its ai:/missing-Class
# behavior, and do not change the maxcap Class used by capacity reservations.
max_acct_unique {
    if (&request:Class && !&request:Class[1] && &request:User-Name && &request:Acct-Session-Id && &request:NAS-IP-Address) {
        if ("%{string:&request:Class}" =~ /^maxcap:[0-9a-f]{32}\z/) {
            # A single pre-existing identity must survive activation of this
            # policy, including a late Stop.  LIMIT 2 bounds ambiguity detection;
            # the existing username/session indexes bound the candidate lookup.
            # sql xlat applies the module's escaping to attribute expansions,
            # just as the existing accounting queries do.
            update request {
                &Tmp-String-9 := "%{sql:SELECT CASE COUNT(*) WHEN 0 THEN 'new' WHEN 1 THEN MIN(acctuniqueid) ELSE 'ambiguous' END FROM (SELECT acctuniqueid FROM radacct WHERE username='%{User-Name}' AND nasipaddress='%{NAS-IP-Address}' AND acctsessionid='%{Acct-Session-Id}' AND BINARY class=BINARY '%{string:&request:Class}' LIMIT 2) AS max_acct_existing}"
            }
            if (&request:Tmp-String-9 =~ /^[0-9a-f]{32}$/) {
                update request {
                    &Acct-Unique-Session-Id := &request:Tmp-String-9
                }
            }
            elsif (&request:Tmp-String-9 == 'new') {
                # Hash each component separately: usernames/session IDs with
                # delimiters cannot shift field boundaries.  NAS and username
                # keep distinct routers/accounts separate, even if Class and
                # Acct-Session-Id have been copied or reused.
                update request {
                    &Acct-Unique-Session-Id := "%{md5:maxacct-v1,%{md5:%{User-Name}},%{md5:%{NAS-IP-Address}},%{md5:%{string:&request:Class}},%{md5:%{Acct-Session-Id}}}"
                }
            }
            elsif (&request:Tmp-String-9 == 'ambiguous') {
                # Previously split histories need separately evidenced repair.
                # Keep the stock identity; never select a row by MAX/LIMIT 1,
                # merge counters, or close a session here.
                noop
            }
            else {
                # An unavailable lookup must not invent another identity.
                update request {
                    &Tmp-String-9 !* ANY
                }
                fail
                return
            }
            update request {
                &Tmp-String-9 !* ANY
            }
        }
    }
}
