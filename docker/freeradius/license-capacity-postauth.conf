    # MAX_LICENSE_ATOMIC_CAPACITY
    update control {
        Tmp-String-0 := "%{md5:%{Packet-Src-IP-Address}|%{NAS-IP-Address}|%{User-Name}|%{Calling-Station-Id}|%{NAS-Port}|%{Packet-Authentication-Vector}}"
        Tmp-String-1 := "%{sql:SELECT fn_reserve_license_slot('%{control:Tmp-String-0}', '%{User-Name}', '%{NAS-IP-Address}', '%{Calling-Station-Id}', '%{NAS-Port}', '%{Packet-Src-IP-Address}')}"
    }
    if (&control:Tmp-String-1 != "1") {
        if (&control:Tmp-String-1 == "0") {
            update reply {
                Reply-Message := "Concurrent session capacity reached"
            }
        }
        else {
            update reply {
                Reply-Message := "License verification unavailable or license invalid"
            }
        }
        reject
    }
    if (User-Name != "healthcheck") {
        update reply {
            Class += "maxcap:%{control:Tmp-String-0}"
        }
    }

    # Freeze only after authentication and capacity acceptance; refresh the first
    # response from the atomic snapshot before sending it to the NAS.
    update control {
        Tmp-String-2 := "%{sql:SELECT fn_freeze_voucher_policy('%{User-Name}')}"
    }
    if (&control:Tmp-String-2 != "1" && &control:Tmp-String-2 != "2" && &control:Tmp-String-2 != "3") {
        reject
    }
    # Only the first accepted policy needs the expensive quota reply refresh.
    if (&control:Tmp-String-2 == "3") {
        update reply {
            Mikrotik-Rate-Limit !* ANY
            Mikrotik-Total-Limit !* ANY
            Mikrotik-Total-Limit-Gigawords !* ANY
            Session-Timeout !* ANY
        }
        sql.authorize
        if (fail || invalid || reject || notfound) {
            reject
        }
    }
    if (&control:Tmp-String-2 == "2" || &control:Tmp-String-2 == "3") {
        update control {
            Tmp-String-3 := "%{sql:SELECT COALESCE(snap_rate_limit_str,'0/0') FROM wisp_vouchers WHERE username='%{User-Name}' AND policy_frozen_at IS NOT NULL}"
        }
        if (&control:Tmp-String-3 == "") {
            reject
        }
        update reply {
            Mikrotik-Rate-Limit := "%{control:Tmp-String-3}"
        }
        if (&reply:Mikrotik-Rate-Limit == "0/0") {
            update reply {
                Mikrotik-Rate-Limit !* ANY
            }
        }
    }
