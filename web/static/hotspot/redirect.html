<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إعادة توجيه...</title>
    <meta http-equiv="refresh" content="0; url=$(link-redirect)">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0b1329;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .loader-card {
            text-align: center;
            background: #111a36;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #1e293b;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
    <script>
        var targetUrl = "$(link-redirect)";
        if (targetUrl && targetUrl.length > 0 && targetUrl !== "$(link-redirect)") {
            window.location.replace(targetUrl);
        }
    </script>
</head>
<body>
    <div class="loader-card">
        <div class="spinner"></div>
        <p>جاري تحويلك تلقائياً...</p>
        <p><a href="$(link-redirect)">اضغط هنا إذا لم يتم التحويل تلقائياً</a></p>
    </div>
    <script>
        setTimeout(function() {
            window.location.href = "$(link-redirect)";
        }, 300);
    </script>
</body>
</html>
